name: Build MT Markdown Preview

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

      - name: Clone official MT V3 template
        shell: bash
        run: |
          git clone --depth=1 https://gitee.com/L-JINBIN/mt-plugin-v3-demo.git mt-plugin-v3-demo

      - name: Inject Markdown Preview plugin
        shell: bash
        run: |
          set -e
          mkdir -p mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/engine

          cat > mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkdownHtml.java <<'JAVA'
          package com.example.mtmarkdown;

          import android.os.Build;
          import android.text.Html;
          import android.text.Spanned;

          public final class MarkdownHtml {
              private MarkdownHtml() {}

              public static Spanned fromHtml(String html) {
                  String safe = normalize(html);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      return Html.fromHtml(safe, Html.FROM_HTML_MODE_LEGACY);
                  }
                  //noinspection deprecation
                  return Html.fromHtml(safe);
              }

              private static String normalize(String html) {
                  if (html == null || html.isEmpty()) return Html.fromHtml("").toString().length() == 0 ? "" : html;
                  String result = html;
                  result = result.replaceAll("(?is)<img[^>]*alt=[\\\"']([^\\\"']*)[\\\"'][^>]*>", "<i>[图片: $1]</i>");
                  result = result.replaceAll("(?is)<img[^>]*>", "<i>[图片]</i>");
                  result = result.replace("<pre>", "<br><tt><small>");
                  result = result.replace("</pre>", "</small></tt><br>");
                  result = result.replace("<code>", "<tt>");
                  result = result.replace("</code>", "</tt>");
                  result = result.replaceAll("(?i)<tr[^>]*>", "");
                  result = result.replaceAll("(?i)</tr>", "<br>");
                  result = result.replaceAll("(?i)</?(th|td)[^>]*>", " | ");
                  result = result.replaceAll("(?i)</?(thead|tbody|tfoot|table)[^>]*>", "");
                  return result;
              }
          }
          JAVA

          cat > mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/engine/MarkdownRendererEngine.java <<'JAVA'
          package com.example.mtmarkdown.engine;

          public interface MarkdownRendererEngine {
              String renderToHtml(String markdown);
              String versionName();
          }
          JAVA

          cat > mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/engine/CommonMarkRendererEngine.java <<'JAVA'
          package com.example.mtmarkdown.engine;

          import org.commonmark.Extension;
          import org.commonmark.ext.autolink.AutolinkExtension;
          import org.commonmark.ext.footnotes.FootnotesExtension;
          import org.commonmark.ext.gfm.alerts.AlertsExtension;
          import org.commonmark.ext.gfm.strikethrough.StrikethroughExtension;
          import org.commonmark.ext.gfm.tables.TablesExtension;
          import org.commonmark.ext.task.list.items.TaskListItemsExtension;
          import org.commonmark.node.Node;
          import org.commonmark.parser.Parser;
          import org.commonmark.renderer.html.HtmlRenderer;

          import java.util.Arrays;
          import java.util.List;

          public final class CommonMarkRendererEngine implements MarkdownRendererEngine {
              private final Parser parser;
              private final HtmlRenderer renderer;

              public CommonMarkRendererEngine() {
                  List<Extension> extensions = Arrays.asList(
                          TablesExtension.create(),
                          StrikethroughExtension.create(),
                          TaskListItemsExtension.create(),
                          AutolinkExtension.create(),
                          FootnotesExtension.create(),
                          AlertsExtension.create()
                  );
                  parser = Parser.builder().extensions(extensions).build();
                  renderer = HtmlRenderer.builder()
                          .extensions(extensions)
                          .escapeHtml(true)
                          .sanitizeUrls(true)
                          .build();
              }

              @Override
              public String renderToHtml(String markdown) {
                  if (markdown == null || markdown.isEmpty()) return "<p></p>";
                  Node document = parser.parse(markdown);
                  return renderer.render(document);
              }

              @Override
              public String versionName() {
                  return "CommonMark 0.30.0";
              }
          }
          JAVA

          cat > mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkdownPreviewToolMenu.java <<'JAVA'
          package com.example.mtmarkdown;

          import android.graphics.drawable.Drawable;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.Spanned;

          import com.example.mtmarkdown.engine.CommonMarkRendererEngine;
          import com.example.mtmarkdown.engine.MarkdownRendererEngine;

          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          import bin.mt.plugin.api.editor.BaseTextEditorToolMenu;
          import bin.mt.plugin.api.editor.TextEditor;
          import bin.mt.plugin.api.ui.PluginUI;
          import bin.mt.plugin.api.ui.PluginView;
          import bin.mt.plugin.api.ui.icon.MaterialIcons;

          public final class MarkdownPreviewToolMenu extends BaseTextEditorToolMenu {
              private static final int MAX_PREVIEW_CHARS = 300_000;

              private final ExecutorService executor = Executors.newSingleThreadExecutor(r -> {
                  Thread thread = new Thread(r, "mt-markdown-renderer");
                  thread.setDaemon(true);
                  return thread;
              });
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private final MarkdownRendererEngine rendererEngine = new CommonMarkRendererEngine();

              @Override
              public String name() {
                  return "Markdown 预览";
              }

              @Override
              public Drawable icon() {
                  return MaterialIcons.get("visibility");
              }

              @Override
              public boolean checkVisible(TextEditor editor) {
                  return true;
              }

              @Override
              public void onMenuClick(PluginUI pluginUI, TextEditor editor) {
                  final String markdown = readMarkdown(editor);
                  if (markdown == null || markdown.trim().isEmpty()) {
                      pluginUI.showToast("没有可预览的 Markdown 内容");
                      return;
                  }

                  if (markdown.length() > MAX_PREVIEW_CHARS) {
                      pluginUI.buildDialog()
                              .setTitle("Markdown 预览")
                              .setMessage("当前内容超过 300000 个字符，本次仅渲染前 300000 个字符。")
                              .setPositiveButton("继续", (dialog, which) -> renderAsync(pluginUI, markdown.substring(0, MAX_PREVIEW_CHARS)))
                              .setNegativeButton("取消", null)
                              .show();
                      return;
                  }
                  renderAsync(pluginUI, markdown);
              }

              private String readMarkdown(TextEditor editor) {
                  int start = editor.getSelectionStart();
                  int end = editor.getSelectionEnd();
                  if (start != end) return editor.subText(start, end);
                  return editor.subText(0, editor.length());
              }

              private void renderAsync(PluginUI pluginUI, String markdown) {
                  pluginUI.showToast("正在渲染 Markdown…");
                  executor.execute(() -> {
                      try {
                          final String html = rendererEngine.renderToHtml(markdown);
                          final Spanned spanned = MarkdownHtml.fromHtml(html);
                          mainHandler.post(() -> showPreview(pluginUI, spanned));
                      } catch (Throwable error) {
                          mainHandler.post(() -> pluginUI.showToast("Markdown 渲染失败: " + error.getMessage()));
                      }
                  });
              }

              private void showPreview(PluginUI pluginUI, Spanned content) {
                  PluginView view = pluginUI.buildVerticalLayout()
                          .addTextView("content")
                          .text(content)
                          .paddingDp(12)
                          .widthMatchParent()
                          .build();

                  pluginUI.buildDialog()
                          .setTitle("Markdown 预览 · " + rendererEngine.versionName())
                          .setView(view)
                          .setPositiveButton("关闭", null)
                          .show();
              }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          p = Path('mt-plugin-v3-demo/template/build.gradle')
          s = p.read_text(encoding='utf-8')
          s = s.replace('pluginID = "com.example.myplugin"', 'pluginID = "com.example.mtmarkdownpreview"')
          s = s.replace('versionName = "v1.0"', 'versionName = "v1.0.0"')
          s = s.replace('name = "{plugin_name}"', 'name = "Markdown 预览"')
          s = s.replace('description = "{plugin_description}"', 'description = "MT 管理器 Markdown 预览与渲染引擎升级插件"')
          s = s.replace('mainPreference = "com.example.myplugin.MyPreference"\n', '')
          s = s.replace('// "com.example.myplugin.MyFunctionInterface",', '"com.example.mtmarkdown.MarkdownPreviewToolMenu",')
          marker = 'dependencies {\n        coreLibraryDesugaring libs.desugar.jdk.libs\n'
          deps = '''dependencies {\n        coreLibraryDesugaring libs.desugar.jdk.libs\n        implementation "org.commonmark:commonmark:0.30.0"\n        implementation "org.commonmark:commonmark-ext-gfm-tables:0.30.0"\n        implementation "org.commonmark:commonmark-ext-gfm-strikethrough:0.30.0"\n        implementation "org.commonmark:commonmark-ext-task-list-items:0.30.0"\n        implementation "org.commonmark:commonmark-ext-autolink:0.30.0"\n        implementation "org.commonmark:commonmark-ext-footnotes:0.30.0"\n        implementation "org.commonmark:commonmark-ext-gfm-alerts:0.30.0"\n'''
          if marker not in s:
              raise SystemExit('dependencies marker not found')
          s = s.replace(marker, deps, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build release MTP
        shell: bash
        working-directory: mt-plugin-v3-demo
        run: |
          chmod +x ./gradlew
          ./gradlew template:packageReleaseMtp --stacktrace

      - name: Upload MTP
        uses: actions/upload-artifact@v4
        with:
          name: MT-Markdown-Preview-v1.0.0
          path: mt-plugin-v3-demo/template/build/outputs/mt-plugin/*.mtp
          if-no-files-found: error
