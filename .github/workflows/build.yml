name: Build MT Markdown Preview V3

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: mt-markdown-preview-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euxo pipefail
          GRADLE_VERSION='8.13'
          GRADLE_HOME="$RUNNER_TEMP/gradle-$GRADLE_VERSION"
          ARCHIVE="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
            -o "$ARCHIVE" \
            "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          rm -rf "$GRADLE_HOME"
          mkdir -p "$RUNNER_TEMP/gradle-dist"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/gradle-dist"
          test -x "$RUNNER_TEMP/gradle-dist/gradle-$GRADLE_VERSION/bin/gradle"
          echo "GRADLE_HOME=$RUNNER_TEMP/gradle-dist/gradle-$GRADLE_VERSION" >> "$GITHUB_ENV"
          echo "PATH=$RUNNER_TEMP/gradle-dist/gradle-$GRADLE_VERSION/bin:$PATH" >> "$GITHUB_ENV"

      - name: Verify standalone project
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE"
          test -f "$ROOT/settings.gradle"
          test -f "$ROOT/build.gradle"
          test -f "$ROOT/gradle.properties"
          test -f "$ROOT/gradle/libs.versions.toml"
          test -f "$ROOT/template/build.gradle"
          test -f "$ROOT/template/src/main/java/com/example/mtmarkdown/MarkdownPreviewToolMenu.java"
          test -f "$ROOT/template/src/main/java/com/example/mtmarkdown/MarkdownRenderer.java"
          test -f "$ROOT/template/src/main/java/com/example/mtmarkdown/MarkdownPreprocessor.java"
          test -f "$ROOT/template/src/main/java/com/example/mtmarkdown/MarkdownGrammarRegistry.java"
          java -version
          gradle --version

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace projects

      - name: Build release MTP
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace template:packageReleaseMtp

      - name: Verify MTP output
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/template/build/outputs/mt-plugin"
          test -d "$OUT"
          find "$OUT" -maxdepth 1 -type f -name '*.mtp' -print
          MTP="$(find "$OUT" -maxdepth 1 -type f -name '*.mtp' -print -quit)"
          test -n "$MTP"
          test -s "$MTP"

      - name: Upload installable MTP
        uses: actions/upload-artifact@v4
        with:
          name: mt-markdown-preview-v3-mtp
          path: template/build/outputs/mt-plugin/*.mtp
          if-no-files-found: error
          retention-days: 14
