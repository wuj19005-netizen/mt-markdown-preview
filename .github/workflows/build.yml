name: Build MT Markdown Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone official MT V3 template
        shell: bash
        run: |
          set -e

          rm -rf mt-plugin-v3-demo

          git clone \
            --depth=1 \
            --branch=main \
            https://gitee.com/L-JINBIN/mt-plugin-v3-demo.git \
            mt-plugin-v3-demo

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            --licenses \
            >/tmp/android-sdk-licenses.log 2>&1 || true

          cat /tmp/android-sdk-licenses.log

      - name: Verify environment
        shell: bash
        run: |
          set -e

          echo "===== JAVA ====="
          java -version

          echo
          echo "===== ANDROID SDK ====="
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "===== SDKMANAGER ====="
          command -v sdkmanager
          sdkmanager --version

          echo
          echo "===== PLATFORM 36 ====="
          test -d "${ANDROID_SDK_ROOT}/platforms/android-36"

          echo
          echo "===== BUILD TOOLS 36.0.0 ====="
          test -d "${ANDROID_SDK_ROOT}/build-tools/36.0.0"

      - name: Detect MaterialIcons
        shell: bash
        run: |
          set -e

          MATERIAL_IMPORT="$(
            grep -Rho \
              '^import [^;]*MaterialIcons;' \
              mt-plugin-v3-demo \
              2>/dev/null \
              | head -n 1 || true
          )"

          if [ -z "${MATERIAL_IMPORT}" ]; then
            echo "ERROR: MaterialIcons import not found."
            grep -R \
              "MaterialIcons" \
              mt-plugin-v3-demo \
              2>/dev/null \
              | head -n 100 || true
            exit 1
          fi

          MATERIAL_ICON_EXPR="$(
            grep -Rho \
              'MaterialIcons\.get("[^"]*")' \
              mt-plugin-v3-demo \
              2>/dev/null \
              | head -n 1 || true
          )"

          if [ -z "${MATERIAL_ICON_EXPR}" ]; then
            MATERIAL_ICON_EXPR='MaterialIcons.get("description")'
          fi

          echo "MATERIAL_IMPORT=${MATERIAL_IMPORT}" >> "${GITHUB_ENV}"
          echo "MATERIAL_ICON_EXPR=${MATERIAL_ICON_EXPR}" >> "${GITHUB_ENV}"

      - name: Create Markdown renderer
        shell: bash
        run: |
          set -e

          SRC="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"
          ENGINE="${SRC}/engine"

          rm -rf "${SRC}"
          mkdir -p "${ENGINE}"

          cat > "${ENGINE}/MarkdownRendererEngine.java" <<'JAVA'
          package com.example.mtmarkdown.engine;

          public interface MarkdownRendererEngine {

              String renderToHtml(String markdown);

              String versionName();
          }
          JAVA

          cat > "${ENGINE}/CommonMarkRendererEngine.java" <<'JAVA'
          package com.example.mtmarkdown.engine;

          import org.commonmark.Extension;
          import org.commonmark.ext.autolink.AutolinkExtension;
          import org.commonmark.ext.footnotes.FootnotesExtension;
          import org.commonmark.ext.gfm.alerts.AlertsExtension;
          import org.commonmark.ext.gfm.strikethrough.StrikethroughExtension;
          import org.commonmark.ext.gfm.tables.TablesExtension;
          import org.commonmark.ext.task.list.items.TaskListItemsExtension;
          import org.commonmark.node.Node;
          import org.commonmark.parser.Parser;
          import org.commonmark.renderer.html.HtmlRenderer;

          import java.util.Arrays;
          import java.util.List;

          public final class CommonMarkRendererEngine
                  implements MarkdownRendererEngine {

              private final Parser parser;
              private final HtmlRenderer renderer;

              public CommonMarkRendererEngine() {

                  List<Extension> extensions =
                          Arrays.asList(
                                  TablesExtension.create(),
                                  StrikethroughExtension.create(),
                                  TaskListItemsExtension.create(),
                                  AutolinkExtension.create(),
                                  FootnotesExtension.create(),
                                  AlertsExtension.create()
                          );

                  parser =
                          Parser.builder()
                                  .extensions(extensions)
                                  .build();

                  renderer =
                          HtmlRenderer.builder()
                                  .extensions(extensions)
                                  .escapeHtml(true)
                                  .sanitizeUrls(true)
                                  .build();
              }

              @Override
              public String renderToHtml(String markdown) {

                  if (markdown == null ||
                          markdown.isEmpty()) {

                      return "<p></p>";
                  }

                  Node document =
                          parser.parse(markdown);

                  return renderer.render(document);
              }

              @Override
              public String versionName() {
                  return "CommonMark 0.30.0";
              }
          }
          JAVA

      - name: Create Android rich text converter
        shell: bash
        run: |
          set -e

          SRC="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"

          cat > "${SRC}/MarkdownHtml.java" <<'JAVA'
          package com.example.mtmarkdown;

          import android.os.Build;
          import android.text.Html;
          import android.text.Spanned;

          public final class MarkdownHtml {

              private MarkdownHtml() {
              }

              public static Spanned render(
                      String html
              ) {

                  if (html == null ||
                          html.trim().isEmpty()) {

                      return Html.fromHtml("");
                  }

                  String normalized =
                          normalize(html);

                  if (Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.N) {

                      return Html.fromHtml(
                              normalized,
                              Html.FROM_HTML_MODE_LEGACY
                      );
                  }

                  //noinspection deprecation
                  return Html.fromHtml(
                          normalized
                  );
              }

              private static String normalize(
                      String source
              ) {

                  String result = source;

                  /*
                   * -------------------------------------------------
                   * Headings
                   *
                   * Don't rely completely on Android's handling of
                   * <h1>-<h6>. Convert them to tags that
                   * Html.fromHtml() handles consistently.
                   * -------------------------------------------------
                   */

                  result = result.replaceAll(
                          "(?is)<h1[^>]*>(.*?)</h1>",
                          "<br><big><big><b>$1</b></big></big><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<h2[^>]*>(.*?)</h2>",
                          "<br><big><b>$1</b></big><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<h3[^>]*>(.*?)</h3>",
                          "<br><big><b>$1</b></big><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<h4[^>]*>(.*?)</h4>",
                          "<br><b>$1</b><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<h5[^>]*>(.*?)</h5>",
                          "<br><b>$1</b><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<h6[^>]*>(.*?)</h6>",
                          "<br><b>$1</b><br>"
                  );

                  /*
                   * -------------------------------------------------
                   * Task list
                   * -------------------------------------------------
                   */

                  result = result.replaceAll(
                          "(?is)<input[^>]*type=[\\\"']checkbox[\\\"'][^>]*checked[^>]*>",
                          "☑ "
                  );

                  result = result.replaceAll(
                          "(?is)<input[^>]*type=[\\\"']checkbox[\\\"'][^>]*>",
                          "☐ "
                  );

                  /*
                   * -------------------------------------------------
                   * Images
                   * -------------------------------------------------
                   */

                  result = result.replaceAll(
                          "(?is)<img[^>]*alt=[\\\"']([^\\\"']*)[\\\"'][^>]*>",
                          "<i>[图片: $1]</i>"
                  );

                  result = result.replaceAll(
                          "(?is)<img[^>]*>",
                          "<i>[图片]</i>"
                  );

                  /*
                   * -------------------------------------------------
                   * Code
                   * -------------------------------------------------
                   */

                  result = result.replaceAll(
                          "(?is)<pre[^>]*>",
                          "<br><tt><small>"
                  );

                  result = result.replaceAll(
                          "(?is)</pre>",
                          "</small></tt><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<code>",
                          "<tt>"
                  );

                  result = result.replaceAll(
                          "(?is)</code>",
                          "</tt>"
                  );

                  /*
                   * -------------------------------------------------
                   * Blockquote
                   * -------------------------------------------------
                   */

                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*>",
                          "<br><b>│ </b>"
                  );

                  /*
                   * -------------------------------------------------
                   * GFM Alerts
                   * -------------------------------------------------
                   */

                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-note[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>提示</b><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-tip[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>提示</b><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-important[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>重要</b><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-warning[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>警告</b><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-caution[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>注意</b><br>"
                  );

                  /*
                   * -------------------------------------------------
                   * Tables
                   * -------------------------------------------------
                   *
                   * Android Html.fromHtml() doesn't provide a real
                   * table layout, so preserve the cells visibly.
                   * -------------------------------------------------
                   */

                  result = result.replaceAll(
                          "(?is)<table[^>]*>",
                          ""
                  );

                  result = result.replaceAll(
                          "(?is)</table>",
                          "<br>"
                  );

                  result = result.replaceAll(
                          "(?is)</?(thead|tbody|tfoot)[^>]*>",
                          ""
                  );

                  result = result.replaceAll(
                          "(?is)<tr[^>]*>",
                          ""
                  );

                  result = result.replaceAll(
                          "(?is)</tr>",
                          "<br>"
                  );

                  result = result.replaceAll(
                          "(?is)</?(th|td)[^>]*>",
                          "  |  "
                  );

                  /*
                   * -------------------------------------------------
                   * Horizontal rule
                   * -------------------------------------------------
                   */

                  result = result.replaceAll(
                          "(?is)<hr\\s*/?>",
                          "<br>────────────────<br>"
                  );

                  /*
                   * -------------------------------------------------
                   * Paragraph spacing
                   * -------------------------------------------------
                   */

                  result = result.replaceAll(
                          "(?is)</p>",
                          "</p><br>"
                  );

                  return result;
              }
          }
          JAVA

      - name: Create Markdown preview menu
        shell: bash
        run: |
          set -e

          SRC="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"

          cat > "${SRC}/MarkdownPreviewToolMenu.java" <<JAVA
          package com.example.mtmarkdown;

          import android.graphics.drawable.Drawable;
          import android.text.Spanned;

          import com.example.mtmarkdown.engine.CommonMarkRendererEngine;
          import com.example.mtmarkdown.engine.MarkdownRendererEngine;

          import bin.mt.plugin.api.editor.BaseTextEditorToolMenu;
          import bin.mt.plugin.api.editor.TextEditor;
          import bin.mt.plugin.api.ui.PluginUI;
          import bin.mt.plugin.api.ui.PluginView;

          ${MATERIAL_IMPORT}

          public final class MarkdownPreviewToolMenu
                  extends BaseTextEditorToolMenu {

              private static final int MAX_PREVIEW_CHARS =
                      300000;

              private final MarkdownRendererEngine engine =
                      new CommonMarkRendererEngine();

              @Override
              public String name() {
                  return "Markdown 预览";
              }

              @Override
              public Drawable icon() {
                  return ${MATERIAL_ICON_EXPR};
              }

              @Override
              public boolean checkVisible(
                      TextEditor editor
              ) {
                  return true;
              }

              @Override
              public void onMenuClick(
                      PluginUI pluginUI,
                      TextEditor editor
              ) {

                  try {

                      /*
                       * 直接同步执行。
                       *
                       * 这里故意不使用 Executor/Handler，
                       * 先把“正在渲染但没有结果”的问题彻底排除。
                       */
                      String markdown =
                              readMarkdown(editor);

                      if (markdown == null ||
                              markdown.trim().isEmpty()) {

                          pluginUI.showToast(
                                  "没有可预览的 Markdown 内容"
                          );

                          return;
                      }

                      if (markdown.length() >
                              MAX_PREVIEW_CHARS) {

                          markdown =
                                  markdown.substring(
                                          0,
                                          MAX_PREVIEW_CHARS
                                  );

                          pluginUI.showToast(
                                  "内容超过 300000 字符，"
                                          + "已截取前 300000 字符"
                          );
                      }

                      /*
                       * Markdown -> HTML
                       */
                      String html =
                              engine.renderToHtml(
                                      markdown
                              );

                      /*
                       * HTML -> Android Spanned
                       */
                      Spanned rendered =
                              MarkdownHtml.render(
                                      html
                              );

                      if (rendered == null) {

                          throw new IllegalStateException(
                                  "Markdown 渲染结果为空"
                          );
                      }

                      /*
                       * 关键：
                       *
                       * 直接把 Spanned 作为 CharSequence
                       * 传给 MT，而不是 toString()。
                       *
                       * MT V3 PluginUI 的 showMessage()
                       * 参数就是 CharSequence。
                       */
                      showPreview(
                              pluginUI,
                              rendered
                      );

                  } catch (Throwable error) {

                      pluginUI.showErrorMessage(
                              error
                      );
                  }
              }

              private String readMarkdown(
                      TextEditor editor
              ) {

                  int start =
                          editor.getSelectionStart();

                  int end =
                          editor.getSelectionEnd();

                  if (start != end) {

                      return editor.subText(
                              start,
                              end
                      );
                  }

                  return editor.subText(
                          0,
                          editor.length()
                  );
              }

              private void showPreview(
                      PluginUI pluginUI,
                      Spanned rendered
              ) {

                  /*
                   * 使用独立预览对话框。
                   *
                   * 编辑器里的原 Markdown 不修改。
                   */
                  PluginView preview =
                          pluginUI
                                  .buildVerticalLayout()
                                  .addTextView(
                                          "markdown_preview"
                                  )
                                  .text(rendered)
                                  .paddingDp(18)
                                  .widthMatchParent()
                                  .build();

                  pluginUI
                          .buildDialog()
                          .setTitle(
                                  "Markdown 预览 · "
                                          + engine
                                                  .versionName()
                          )
                          .setView(preview)
                          .setPositiveButton(
                                  "关闭",
                                  null
                          )
                          .show();
              }
          }
          JAVA

      - name: Configure MT plugin
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "mt-plugin-v3-demo/template/build.gradle"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # Replace mtPlugin block using balanced braces.
          # ---------------------------------------------------------

          marker = "mtPlugin"
          start = text.find(marker)

          if start < 0:
              raise SystemExit(
                  "ERROR: mtPlugin block not found."
              )

          open_brace = text.find(
              "{",
              start
          )

          if open_brace < 0:
              raise SystemExit(
                  "ERROR: mtPlugin opening brace not found."
              )

          depth = 0
          end = None

          for i in range(
              open_brace,
              len(text)
          ):

              ch = text[i]

              if ch == "{":
                  depth += 1

              elif ch == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit(
                  "ERROR: mtPlugin closing brace not found."
              )

          new_block = """
          mtPlugin {
              pluginID = "com.example.mtmarkdownpreview"
              versionCode = 6
              versionName = "v1.5.0"
              name = "Markdown 预览"
              description = "MT 管理器 Markdown 预览与渲染引擎升级插件"

              interfaces = [
                  "com.example.mtmarkdown.MarkdownPreviewToolMenu"
              ]
          }
          """.strip()

          text = (
              text[:start]
              + new_block
              + text[end:]
          )

          # ---------------------------------------------------------
          # Add CommonMark dependencies exactly once.
          # ---------------------------------------------------------

          dependencies = """
                  implementation "org.commonmark:commonmark:0.30.0"
                  implementation "org.commonmark:commonmark-ext-gfm-tables:0.30.0"
                  implementation "org.commonmark:commonmark-ext-gfm-strikethrough:0.30.0"
                  implementation "org.commonmark:commonmark-ext-task-list-items:0.30.0"
                  implementation "org.commonmark:commonmark-ext-autolink:0.30.0"
                  implementation "org.commonmark:commonmark-ext-footnotes:0.30.0"
                  implementation "org.commonmark:commonmark-ext-gfm-alerts:0.30.0"
          """.strip()

          if (
              "org.commonmark:commonmark:0.30.0"
              not in text
          ):

              dependency_marker = text.find(
                  "dependencies {"
              )

              if dependency_marker < 0:

                  text = (
                      text
                      + "\n\n"
                      + "dependencies {\n"
                      + dependencies
                      + "\n}\n"
                  )

              else:

                  dependency_brace = text.find(
                      "{",
                      dependency_marker
                  )

                  if dependency_brace < 0:
                      raise SystemExit(
                          "ERROR: dependencies opening brace not found."
                      )

                  text = (
                      text[:dependency_brace + 1]
                      + "\n"
                      + dependencies
                      + text[dependency_brace + 1:]
                  )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      - name: Verify source
        shell: bash
        run: |
          set -e

          echo "===== build.gradle ====="

          sed -n '1,420p' \
            mt-plugin-v3-demo/template/build.gradle

          echo
          echo "===== MarkdownPreviewToolMenu.java ====="

          sed -n '1,460p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkdownPreviewToolMenu.java

          echo
          echo "===== MarkdownHtml.java ====="

          sed -n '1,460p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkdownHtml.java

          echo
          echo "===== CommonMarkRendererEngine.java ====="

          sed -n '1,360p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/engine/CommonMarkRendererEngine.java

      - name: Prepare Gradle
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -e
          chmod +x ./gradlew

      - name: Check Gradle
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -e
          ./gradlew --version

      - name: Build release MTP
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -e

          ./gradlew \
            template:packageReleaseMtp \
            --stacktrace \
            --no-daemon

      - name: Find generated MTP
        shell: bash
        run: |
          set -e

          echo "===== GENERATED MTP ====="

          find \
            mt-plugin-v3-demo/template/build/outputs/mt-plugin \
            -maxdepth 2 \
            -type f \
            -name "*.mtp" \
            -print \
            -exec ls -lh {} \;

      - name: Upload MTP
        uses: actions/upload-artifact@v4
        with:
          name: MT-Markdown-Preview-v1.5.0
          path: |
            mt-plugin-v3-demo/template/build/outputs/mt-plugin/*.mtp
          if-no-files-found: error
