name: Build MT Markdown Preview V3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'false'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Fetch MT Plugin V3 demo
        shell: bash
        run: |
          rm -rf mt-plugin-v3-demo
          git clone --depth 1 https://gitee.com/L-JINBIN/mt-plugin-v3-demo.git mt-plugin-v3-demo

      - name: Overlay this plugin project
        shell: bash
        run: |
          rsync -a --exclude='.git/' "./" "mt-plugin-v3-demo/"
          test -f mt-plugin-v3-demo/gradlew
          test -f mt-plugin-v3-demo/template/build.gradle
          test -f mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkdownPreviewToolMenu.java

      - name: Build release MTP
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew template:packageReleaseMtp --stacktrace --no-daemon

      - name: Verify MTP output
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          find template/build/outputs/mt-plugin -maxdepth 1 -type f -name '*.mtp' -print
          test -n "$(find template/build/outputs/mt-plugin -maxdepth 1 -type f -name '*.mtp' -print -quit)"

      - name: Upload installable MTP
        uses: actions/upload-artifact@v4
        with:
          name: mt-markdown-preview-v3-mtp
          path: mt-plugin-v3-demo/template/build/outputs/mt-plugin/*.mtp
          if-no-files-found: error
          retention-days: 14
