name: Build MT Markdown Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone official MT V3 template
        shell: bash
        run: |
          set -e

          rm -rf mt-plugin-v3-demo

          git clone \
            --depth=1 \
            --branch=main \
            https://gitee.com/L-JINBIN/mt-plugin-v3-demo.git \
            mt-plugin-v3-demo

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            --licenses \
            >/tmp/licenses.log 2>&1 || true

          cat /tmp/licenses.log

      - name: Detect MaterialIcons
        shell: bash
        run: |
          set -e

          MATERIAL_IMPORT="$(
            grep -Rho \
              '^import [^;]*MaterialIcons;' \
              mt-plugin-v3-demo \
              2>/dev/null \
              | head -n 1 || true
          )"

          if [ -z "${MATERIAL_IMPORT}" ]; then
            echo "MaterialIcons import not found."
            grep -R \
              "MaterialIcons" \
              mt-plugin-v3-demo \
              2>/dev/null \
              | head -n 100 || true
            exit 1
          fi

          MATERIAL_ICON_EXPR="$(
            grep -Rho \
              'MaterialIcons\.get("[^"]*")' \
              mt-plugin-v3-demo \
              2>/dev/null \
              | head -n 1 || true
          )"

          if [ -z "${MATERIAL_ICON_EXPR}" ]; then
            MATERIAL_ICON_EXPR='MaterialIcons.get("preview")'
          fi

          echo "MATERIAL_IMPORT=${MATERIAL_IMPORT}" >> "${GITHUB_ENV}"
          echo "MATERIAL_ICON_EXPR=${MATERIAL_ICON_EXPR}" >> "${GITHUB_ENV}"

      - name: Create Markdown source
        shell: bash
        run: |
          set -e

          SRC="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"
          ENGINE="${SRC}/engine"

          rm -rf "${SRC}"
          mkdir -p "${ENGINE}"

          cat > "${ENGINE}/MarkdownRendererEngine.java" <<'JAVA'
          package com.example.mtmarkdown.engine;

          public interface MarkdownRendererEngine {

              String renderToHtml(String markdown);

              String versionName();
          }
          JAVA

          cat > "${ENGINE}/CommonMarkRendererEngine.java" <<'JAVA'
          package com.example.mtmarkdown.engine;

          import org.commonmark.Extension;
          import org.commonmark.ext.autolink.AutolinkExtension;
          import org.commonmark.ext.footnotes.FootnotesExtension;
          import org.commonmark.ext.gfm.alerts.AlertsExtension;
          import org.commonmark.ext.gfm.strikethrough.StrikethroughExtension;
          import org.commonmark.ext.gfm.tables.TablesExtension;
          import org.commonmark.ext.task.list.items.TaskListItemsExtension;
          import org.commonmark.node.Node;
          import org.commonmark.parser.Parser;
          import org.commonmark.renderer.html.HtmlRenderer;

          import java.util.Arrays;
          import java.util.List;

          public final class CommonMarkRendererEngine
                  implements MarkdownRendererEngine {

              private final Parser parser;
              private final HtmlRenderer renderer;

              public CommonMarkRendererEngine() {

                  List<Extension> extensions =
                          Arrays.asList(
                                  TablesExtension.create(),
                                  StrikethroughExtension.create(),
                                  TaskListItemsExtension.create(),
                                  AutolinkExtension.create(),
                                  FootnotesExtension.create(),
                                  AlertsExtension.create()
                          );

                  parser =
                          Parser.builder()
                                  .extensions(extensions)
                                  .build();

                  renderer =
                          HtmlRenderer.builder()
                                  .extensions(extensions)
                                  .escapeHtml(true)
                                  .sanitizeUrls(true)
                                  .build();
              }

              @Override
              public String renderToHtml(
                      String markdown
              ) {

                  if (markdown == null ||
                          markdown.isEmpty()) {
                      return "<p></p>";
                  }

                  Node document =
                          parser.parse(markdown);

                  return renderer.render(document);
              }

              @Override
              public String versionName() {
                  return "CommonMark 0.30.0";
              }
          }
          JAVA

          cat > "${SRC}/MarkdownHtml.java" <<'JAVA'
          package com.example.mtmarkdown;

          import android.os.Build;
          import android.text.Html;
          import android.text.Spanned;

          public final class MarkdownHtml {

              private MarkdownHtml() {
              }

              public static Spanned render(
                      String html
              ) {

                  if (html == null ||
                          html.isEmpty()) {

                      return Html.fromHtml("");
                  }

                  String normalized =
                          normalize(html);

                  if (Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.N) {

                      return Html.fromHtml(
                              normalized,
                              Html.FROM_HTML_MODE_LEGACY
                      );
                  }

                  //noinspection deprecation
                  return Html.fromHtml(
                          normalized
                  );
              }

              private static String normalize(
                      String html
              ) {

                  String result = html;

                  /*
                   * Task list.
                   */
                  result = result.replaceAll(
                          "(?is)<input[^>]*type=[\\\"']checkbox[\\\"'][^>]*checked[^>]*>",
                          "☑ "
                  );

                  result = result.replaceAll(
                          "(?is)<input[^>]*type=[\\\"']checkbox[\\\"'][^>]*>",
                          "☐ "
                  );

                  /*
                   * Images.
                   */
                  result = result.replaceAll(
                          "(?is)<img[^>]*alt=[\\\"']([^\\\"']*)[\\\"'][^>]*>",
                          "<i>[图片: $1]</i>"
                  );

                  result = result.replaceAll(
                          "(?is)<img[^>]*>",
                          "<i>[图片]</i>"
                  );

                  /*
                   * GFM alert labels.
                   */
                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-note[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>提示</b><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-tip[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>提示</b><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-important[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>重要</b><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-warning[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>警告</b><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-caution[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>注意</b><br>"
                  );

                  /*
                   * Tables:
                   * Android Html.fromHtml() 对 table 支持有限，
                   * 转成普通文本避免整块消失。
                   */
                  result = result.replaceAll(
                          "(?i)<tr[^>]*>",
                          ""
                  );

                  result = result.replaceAll(
                          "(?i)</tr>",
                          "<br>"
                  );

                  result = result.replaceAll(
                          "(?i)</?(th|td)[^>]*>",
                          " | "
                  );

                  result = result.replaceAll(
                          "(?i)</?(thead|tbody|tfoot|table)[^>]*>",
                          ""
                  );

                  /*
                   * 给代码块增加空行。
                   */
                  result = result.replace(
                          "<pre>",
                          "<br><tt>"
                  );

                  result = result.replace(
                          "</pre>",
                          "</tt><br>"
                  );

                  return result;
              }
          }
          JAVA

      - name: Create Markdown preview menu
        shell: bash
        run: |
          set -e

          SRC="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"

          cat > "${SRC}/MarkdownPreviewToolMenu.java" <<JAVA
          package com.example.mtmarkdown;

          import android.graphics.drawable.Drawable;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.Spanned;

          import com.example.mtmarkdown.engine.CommonMarkRendererEngine;
          import com.example.mtmarkdown.engine.MarkdownRendererEngine;

          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          import bin.mt.plugin.api.editor.BaseTextEditorToolMenu;
          import bin.mt.plugin.api.editor.TextEditor;
          import bin.mt.plugin.api.ui.PluginUI;

          ${MATERIAL_IMPORT}

          public final class MarkdownPreviewToolMenu
                  extends BaseTextEditorToolMenu {

              private static final int MAX_CHARS =
                      300000;

              private final ExecutorService executor =
                      Executors.newSingleThreadExecutor();

              private final Handler mainHandler =
                      new Handler(
                              Looper.getMainLooper()
                      );

              private final MarkdownRendererEngine engine =
                      new CommonMarkRendererEngine();

              @Override
              public String name() {
                  return "Markdown 预览";
              }

              @Override
              public Drawable icon() {
                  return ${MATERIAL_ICON_EXPR};
              }

              @Override
              public boolean checkVisible(
                      TextEditor editor
              ) {
                  return true;
              }

              @Override
              public void onMenuClick(
                      PluginUI pluginUI,
                      TextEditor editor
              ) {

                  final String markdown;

                  try {

                      markdown =
                              readMarkdown(editor);

                  } catch (Throwable e) {

                      pluginUI.showToastL(
                              "读取编辑器内容失败："
                                      + messageOf(e)
                      );

                      return;
                  }

                  if (markdown == null ||
                          markdown.trim().isEmpty()) {

                      pluginUI.showToast(
                              "没有可预览的 Markdown 内容"
                      );

                      return;
                  }

                  final String source;

                  if (markdown.length() >
                          MAX_CHARS) {

                      source =
                              markdown.substring(
                                      0,
                                      MAX_CHARS
                              );

                      pluginUI.showToast(
                              "内容超过 300000 字符，"
                                      + "已截取前 300000 字符"
                      );

                  } else {

                      source = markdown;
                  }

                  pluginUI.showToast(
                          "正在渲染 Markdown…"
                  );

                  executor.execute(
                          () -> render(
                                  pluginUI,
                                  source
                          )
                  );
              }

              private String readMarkdown(
                      TextEditor editor
              ) {

                  int start =
                          editor.getSelectionStart();

                  int end =
                          editor.getSelectionEnd();

                  if (start != end) {

                      return editor.subText(
                              start,
                              end
                      );
                  }

                  return editor.subText(
                          0,
                          editor.length()
                  );
              }

              private void render(
                      PluginUI pluginUI,
                      String markdown
              ) {

                  try {

                      /*
                       * Markdown
                       *   ↓
                       * CommonMark HTML
                       *   ↓
                       * Android Spanned
                       *   ↓
                       * PluginDialog.setMessage(CharSequence)
                       *
                       * 不再经过 PluginView/TextView Builder。
                       */
                      String html =
                              engine.renderToHtml(
                                      markdown
                              );

                      if (html == null ||
                              html.trim().isEmpty()) {

                          throw new IllegalStateException(
                                  "渲染器没有产生 HTML"
                          );
                      }

                      Spanned content =
                              MarkdownHtml.render(
                                      html
                              );

                      if (content == null) {

                          throw new IllegalStateException(
                                  "HTML 转换失败"
                          );
                      }

                      mainHandler.post(
                              () -> showResult(
                                      pluginUI,
                                      content
                              )
                      );

                  } catch (Throwable e) {

                      final String error =
                              messageOf(e);

                      mainHandler.post(
                              () ->
                                      pluginUI.showToastL(
                                              "Markdown 渲染失败："
                                                      + error
                                      )
                      );
                  }
              }

              private void showResult(
                      PluginUI pluginUI,
                      Spanned content
              ) {

                  pluginUI.buildDialog()
                          .setTitle(
                                  "Markdown 预览 · "
                                          + engine
                                                  .versionName()
                          )
                          .setMessage(content)
                          .setPositiveButton(
                                  "关闭",
                                  null
                          )
                          .show();
              }

              private static String messageOf(
                      Throwable error
              ) {

                  String message =
                          error.getMessage();

                  if (message != null &&
                          !message.isEmpty()) {

                      return message;
                  }

                  return error.getClass()
                          .getSimpleName();
              }
          }
          JAVA

      - name: Configure MT plugin
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "mt-plugin-v3-demo/template/build.gradle"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # Replace mtPlugin block.
          # --------------------------------------------------------
          marker = "mtPlugin"
          start = text.find(marker)

          if start < 0:
              raise SystemExit(
                  "ERROR: mtPlugin block not found."
              )

          open_brace = text.find(
              "{",
              start
          )

          if open_brace < 0:
              raise SystemExit(
                  "ERROR: mtPlugin opening brace not found."
              )

          depth = 0
          end = None

          for i in range(
              open_brace,
              len(text)
          ):

              ch = text[i]

              if ch == "{":
                  depth += 1

              elif ch == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit(
                  "ERROR: mtPlugin closing brace not found."
              )

          new_block = """
          mtPlugin {
              pluginID = "com.example.mtmarkdownpreview"
              versionCode = 5
              versionName = "v1.4.0"
              name = "Markdown 预览"
              description = "MT 管理器 Markdown 预览与渲染引擎升级插件"

              interfaces = [
                  "com.example.mtmarkdown.MarkdownPreviewToolMenu"
              ]
          }
          """.strip()

          text = (
              text[:start]
              + new_block
              + text[end:]
          )

          # --------------------------------------------------------
          # CommonMark dependencies.
          # --------------------------------------------------------
          deps = """
                  implementation "org.commonmark:commonmark:0.30.0"
                  implementation "org.commonmark:commonmark-ext-gfm-tables:0.30.0"
                  implementation "org.commonmark:commonmark-ext-gfm-strikethrough:0.30.0"
                  implementation "org.commonmark:commonmark-ext-task-list-items:0.30.0"
                  implementation "org.commonmark:commonmark-ext-autolink:0.30.0"
                  implementation "org.commonmark:commonmark-ext-footnotes:0.30.0"
                  implementation "org.commonmark:commonmark-ext-gfm-alerts:0.30.0"
          """.strip()

          if (
              "org.commonmark:commonmark:0.30.0"
              not in text
          ):

              dependency_marker =
                  text.find("dependencies {")

              if dependency_marker < 0:

                  text += (
                      "\n\n"
                      "dependencies {\n"
                      + deps
                      + "\n}\n"
                  )

              else:

                  brace =
                      text.find(
                          "{",
                          dependency_marker
                      )

                  text = (
                      text[:brace + 1]
                      + "\n"
                      + deps
                      + text[brace + 1:]
                  )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      - name: Verify generated files
        shell: bash
        run: |
          set -e

          echo "===== build.gradle ====="

          sed -n '1,420p' \
            mt-plugin-v3-demo/template/build.gradle

          echo
          echo "===== MarkdownPreviewToolMenu.java ====="

          sed -n '1,460p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkdownPreviewToolMenu.java

          echo
          echo "===== MarkdownHtml.java ====="

          sed -n '1,360p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkdownHtml.java

          echo
          echo "===== CommonMarkRendererEngine.java ====="

          sed -n '1,340p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/engine/CommonMarkRendererEngine.java

      - name: Prepare Gradle
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -e
          chmod +x ./gradlew

      - name: Check Gradle
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -e
          ./gradlew --version

      - name: Build MTP
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -e

          ./gradlew \
            template:packageReleaseMtp \
            --stacktrace \
            --no-daemon

      - name: Find MTP
        shell: bash
        run: |
          set -e

          echo "===== GENERATED MTP ====="

          find \
            mt-plugin-v3-demo/template/build/outputs/mt-plugin \
            -maxdepth 2 \
            -type f \
            -name "*.mtp" \
            -print \
            -exec ls -lh {} \;

      - name: Upload MTP
        uses: actions/upload-artifact@v4
        with:
          name: MT-Markdown-Preview-v1.4.0
          path: |
            mt-plugin-v3-demo/template/build/outputs/mt-plugin/*.mtp
          if-no-files-found: error
