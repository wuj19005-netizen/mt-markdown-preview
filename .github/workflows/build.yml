name: Build MT Markdown Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone official MT V3 template
        shell: bash
        run: |
          set -e

          rm -rf mt-plugin-v3-demo

          git clone \
            --depth=1 \
            --branch=main \
            https://gitee.com/L-JINBIN/mt-plugin-v3-demo.git \
            mt-plugin-v3-demo

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android command line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            --licenses \
            >/tmp/android-sdk-licenses.log 2>&1 || true

          cat /tmp/android-sdk-licenses.log

      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "===== Java ====="
          java -version

          echo
          echo "===== Android SDK ====="
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "===== sdkmanager ====="
          command -v sdkmanager
          sdkmanager --version

          echo
          echo "===== Android 36 ====="
          test -d "${ANDROID_SDK_ROOT}/platforms/android-36"

          echo
          echo "===== Build Tools 36.0.0 ====="
          test -d "${ANDROID_SDK_ROOT}/build-tools/36.0.0"

      - name: Detect MaterialIcons
        shell: bash
        run: |
          set -e

          MATERIAL_IMPORT="$(
            grep -Rho \
              '^import [^;]*MaterialIcons;' \
              mt-plugin-v3-demo \
              2>/dev/null |
            head -n 1 || true
          )"

          if [ -z "${MATERIAL_IMPORT}" ]; then
            echo "ERROR: MaterialIcons import not found."
            grep -R \
              "MaterialIcons" \
              mt-plugin-v3-demo \
              2>/dev/null |
            head -n 100 || true
            exit 1
          fi

          MATERIAL_ICON_EXPR="$(
            grep -Rho \
              'MaterialIcons\.get("[^"]*")' \
              mt-plugin-v3-demo \
              2>/dev/null |
            head -n 1 || true
          )"

          if [ -z "${MATERIAL_ICON_EXPR}" ]; then
            MATERIAL_ICON_EXPR='MaterialIcons.get("visibility")'
          fi

          echo "MATERIAL_IMPORT=${MATERIAL_IMPORT}" >> "${GITHUB_ENV}"
          echo "MATERIAL_ICON_EXPR=${MATERIAL_ICON_EXPR}" >> "${GITHUB_ENV}"

          echo "MaterialIcons import:"
          echo "${MATERIAL_IMPORT}"

          echo "MaterialIcons expression:"
          echo "${MATERIAL_ICON_EXPR}"

      - name: Configure AndroidManifest safely
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path(
              "mt-plugin-v3-demo/template/src/main/AndroidManifest.xml"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET" />'
          )

          if "android.permission.INTERNET" not in text:

              closing = "</manifest>"

              if closing not in text:
                  raise SystemExit(
                      "ERROR: </manifest> not found"
                  )

              text = text.replace(
                  closing,
                  "    "
                  + permission
                  + "\n"
                  + closing,
                  1
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          ET.parse(path)

          print(
              "AndroidManifest.xml: valid XML"
          )
          PY

      - name: Create Markwon Prism bundle
        shell: bash
        run: |
          set -e

          SRC="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"

          rm -rf "${SRC}"

          mkdir -p "${SRC}"

          cat > "${SRC}/MarkdownPrismBundle.java" <<'JAVA'
          package com.example.mtmarkdown;

          import io.noties.prism4j.annotations.PrismBundle;

          @PrismBundle(
                  includes = {
                          "clike",
                          "java",
                          "kotlin",
                          "javascript",
                          "json",
                          "python",
                          "markup",
                          "css",
                          "c",
                          "cpp",
                          "csharp",
                          "go",
                          "groovy",
                          "dart",
                          "sql",
                          "swift",
                          "scala",
                          "yaml",
                          "markdown",
                          "latex"
                  },
                  grammarLocatorClassName = ".MarkdownGrammarLocator"
          )
          public final class MarkdownPrismBundle {

              private MarkdownPrismBundle() {
              }
          }
          JAVA

      - name: Create Markwon renderer
        shell: bash
        run: |
          set -e

          SRC="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"

          cat > "${SRC}/MarkwonRenderer.java" <<'JAVA'
          package com.example.mtmarkdown;

          import android.content.Context;
          import android.text.Spanned;
          import android.widget.TextView;

          import io.noties.markwon.Markwon;
          import io.noties.markwon.ext.latex.JLatexMathPlugin;
          import io.noties.markwon.ext.strikethrough.StrikethroughPlugin;
          import io.noties.markwon.ext.tables.TablePlugin;
          import io.noties.markwon.ext.tasklist.TaskListPlugin;
          import io.noties.markwon.html.HtmlPlugin;
          import io.noties.markwon.image.ImagesPlugin;
          import io.noties.markwon.inlineparser.MarkwonInlineParserPlugin;
          import io.noties.markwon.syntax.Prism4jThemeDefault;
          import io.noties.markwon.syntax.SyntaxHighlightPlugin;
          import io.noties.prism4j.Prism4j;

          public final class MarkwonRenderer {

              private final Markwon markwon;

              public MarkwonRenderer(
                      Context context,
                      float textSizePx
              ) {

                  Prism4j prism4j =
                          new Prism4j(
                                  new MarkdownGrammarLocator()
                          );

                  markwon =
                          Markwon.builder(context)

                                  .usePlugin(
                                          StrikethroughPlugin.create()
                                  )

                                  .usePlugin(
                                          TablePlugin.create()
                                  )

                                  .usePlugin(
                                          TaskListPlugin.create()
                                  )

                                  .usePlugin(
                                          HtmlPlugin.create()
                                  )

                                  .usePlugin(
                                          ImagesPlugin.create()
                                  )

                                  /*
                                   * LaTeX 行内公式需要
                                   * MarkwonInlineParserPlugin。
                                   */
                                  .usePlugin(
                                          MarkwonInlineParserPlugin.create()
                                  )

                                  .usePlugin(
                                          JLatexMathPlugin.create(
                                                  textSizePx,
                                                  new JLatexMathPlugin.BuilderConfigure() {
                                                      @Override
                                                      public void configureBuilder(
                                                              JLatexMathPlugin.Builder builder
                                                      ) {
                                                          builder
                                                                  .inlinesEnabled(true)
                                                                  .blocksEnabled(true);
                                                      }
                                                  }
                                          )
                                  )

                                  .usePlugin(
                                          SyntaxHighlightPlugin.create(
                                                  prism4j,
                                                  Prism4jThemeDefault.create()
                                          )
                                  )

                                  .build();
              }

              public Spanned render(
                      String markdown
              ) {

                  return markwon.toMarkdown(
                          normalizeLatex(markdown)
                  );
              }

              public void renderInto(
                      TextView textView,
                      String markdown
              ) {

                  markwon.setMarkdown(
                          textView,
                          normalizeLatex(markdown)
                  );
              }

              private static String normalizeLatex(
                      String input
              ) {

                  if (input == null ||
                          input.isEmpty()) {
                      return "";
                  }

                  StringBuilder out =
                          new StringBuilder(
                                  input.length() + 64
                          );

                  boolean fencedCode = false;
                  boolean inlineCode = false;

                  int i = 0;

                  while (i < input.length()) {

                      /*
                       * fenced code block
                       */
                      if (input.startsWith(
                              "```",
                              i
                      )) {

                          fencedCode =
                                  !fencedCode;

                          out.append("```");

                          i += 3;

                          continue;
                      }

                      char c =
                              input.charAt(i);

                      /*
                       * inline code
                       */
                      if (!fencedCode &&
                              c == '`') {

                          inlineCode =
                                  !inlineCode;

                          out.append(c);

                          i++;

                          continue;
                      }

                      /*
                       * \( ... \)
                       */
                      if (!fencedCode &&
                              !inlineCode &&
                              c == '\\' &&
                              i + 1 < input.length() &&
                              input.charAt(i + 1) == '(') {

                          int end =
                                  input.indexOf(
                                          "\\)",
                                          i + 2
                                  );

                          if (end >= 0) {

                              String formula =
                                      input.substring(
                                              i + 2,
                                              end
                                      );

                              out.append("$$")
                                      .append(formula)
                                      .append("$$");

                              i = end + 2;

                              continue;
                          }
                      }

                      /*
                       * \[ ... \]
                       */
                      if (!fencedCode &&
                              !inlineCode &&
                              c == '\\' &&
                              i + 1 < input.length() &&
                              input.charAt(i + 1) == '[') {

                          int end =
                                  input.indexOf(
                                          "\\]",
                                          i + 2
                                  );

                          if (end >= 0) {

                              String formula =
                                      input.substring(
                                              i + 2,
                                              end
                                      );

                              out.append("$$\n")
                                      .append(formula)
                                      .append("\n$$");

                              i = end + 2;

                              continue;
                          }
                      }

                      /*
                       * Escaped dollar.
                       */
                      if (!fencedCode &&
                              !inlineCode &&
                              c == '\\' &&
                              i + 1 < input.length() &&
                              input.charAt(i + 1) == '$') {

                          out.append("\\$");

                          i += 2;

                          continue;
                      }

                      /*
                       * Keep existing $$ block/inline formulas unchanged.
                       */
                      if (!fencedCode &&
                              !inlineCode &&
                              c == '$' &&
                              i + 1 < input.length() &&
                              input.charAt(i + 1) == '$') {

                          out.append("$$");

                          i += 2;

                          continue;
                      }

                      /*
                       * Common Markdown also uses $...$.
                       *
                       * Markwon's LaTeX extension uses $$...$$
                       * for inline formulas, so convert an unescaped
                       * single-dollar pair.
                       */
                      if (!fencedCode &&
                              !inlineCode &&
                              c == '$') {

                          int end =
                                  findSingleDollarEnd(
                                          input,
                                          i + 1
                                  );

                          if (end >= 0) {

                              String formula =
                                      input.substring(
                                              i + 1,
                                              end
                                      );

                              if (looksLikeLatex(
                                      formula
                              )) {

                                  out.append("$$")
                                          .append(formula)
                                          .append("$$");

                                  i = end + 1;

                                  continue;
                              }
                          }
                      }

                      out.append(c);

                      i++;
                  }

                  return out.toString();
              }

              private static int findSingleDollarEnd(
                      String text,
                      int start
              ) {

                  for (
                          int i = start;
                          i < text.length();
                          i++
                  ) {

                      char c =
                              text.charAt(i);

                      /*
                       * Single-dollar inline formula cannot cross
                       * a physical line.
                       */
                      if (c == '\n' ||
                              c == '\r') {
                          return -1;
                      }

                      if (c == '\\') {
                          i++;
                          continue;
                      }

                      if (c == '$') {

                          if (i + 1 < text.length() &&
                                  text.charAt(i + 1) == '$') {

                              i++;

                              continue;
                          }

                          return i;
                      }
                  }

                  return -1;
              }

              private static boolean looksLikeLatex(
                      String formula
              ) {

                  String value =
                          formula.trim();

                  if (value.isEmpty() ||
                          value.length() > 10000) {

                      return false;
                  }

                  /*
                   * Avoid turning simple currency expressions such as
                   * $100 or $12.50 into formulas.
                   */
                  if (value.matches(
                          "[0-9.,+\\- ]+"
                  )) {
                      return false;
                  }

                  return value.contains("\\")
                          || value.contains("^")
                          || value.contains("_")
                          || value.contains("{")
                          || value.contains("}")
                          || value.contains("=")
                          || value.matches(
                                  ".*[A-Za-z].*"
                          );
              }
          }
          JAVA

      - name: Create native TextView finder
        shell: bash
        run: |
          set -e

          SRC="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"

          cat > "${SRC}/NativeTextViewFinder.java" <<'JAVA'
          package com.example.mtmarkdown;

          import android.widget.TextView;

          import java.lang.reflect.Field;
          import java.lang.reflect.Modifier;
          import java.util.Collections;
          import java.util.IdentityHashMap;
          import java.util.Set;

          public final class NativeTextViewFinder {

              private NativeTextViewFinder() {
              }

              public static TextView find(
                      Object root
              ) {

                  Set<Object> visited =
                          Collections.newSetFromMap(
                                  new IdentityHashMap<>()
                          );

                  return find(
                          root,
                          visited,
                          0
                  );
              }

              private static TextView find(
                      Object value,
                      Set<Object> visited,
                      int depth
              ) {

                  if (value == null ||
                          depth > 6 ||
                          visited.contains(value)) {

                      return null;
                  }

                  visited.add(value);

                  if (value instanceof TextView) {
                      return (TextView) value;
                  }

                  Class<?> type =
                          value.getClass();

                  while (
                          type != null &&
                          type != Object.class
                  ) {

                      Field[] fields;

                      try {
                          fields =
                                  type.getDeclaredFields();
                      } catch (Throwable ignored) {

                          fields =
                                  new Field[0];
                      }

                      for (
                              Field field : fields
                      ) {

                          int modifiers =
                                  field.getModifiers();

                          if (
                                  Modifier.isStatic(
                                          modifiers
                                  )
                          ) {
                              continue;
                          }

                          try {

                              field.setAccessible(
                                      true
                              );

                              Object child =
                                      field.get(value);

                              if (child == null) {
                                  continue;
                              }

                              if (
                                      child instanceof TextView
                              ) {

                                  return (
                                          TextView
                                                  ) child;
                              }

                              Class<?> childType =
                                      child.getClass();

                              Package pkg =
                                      childType.getPackage();

                              String packageName =
                                      pkg == null
                                              ? ""
                                              : pkg.getName();

                              /*
                               * Only walk MT wrapper objects and
                               * Android View/ViewGroup objects.
                               */
                              if (
                                      packageName.startsWith(
                                              "bin.mt.plugin"
                                      ) ||
                                      child instanceof
                                              android.view.ViewGroup
                              ) {

                                  TextView result =
                                          find(
                                                  child,
                                                  visited,
                                                  depth + 1
                                          );

                                  if (
                                          result != null
                                  ) {
                                      return result;
                                  }
                              }

                          } catch (
                                  Throwable ignored
                          ) {
                          }
                      }

                      type =
                              type.getSuperclass();
                  }

                  return null;
              }
          }
          JAVA

      - name: Create Markdown preview menu
        shell: bash
        run: |
          set -e

          SRC="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"

          cat > "${SRC}/MarkdownPreviewToolMenu.java" <<JAVA
          package com.example.mtmarkdown;

          import android.content.Context;
          import android.graphics.drawable.Drawable;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.Spanned;
          import android.widget.TextView;

          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          import bin.mt.plugin.api.editor.BaseTextEditorToolMenu;
          import bin.mt.plugin.api.editor.TextEditor;
          import bin.mt.plugin.api.ui.PluginDialog;
          import bin.mt.plugin.api.ui.PluginTextView;
          import bin.mt.plugin.api.ui.PluginUI;
          import bin.mt.plugin.api.ui.PluginView;

          ${MATERIAL_IMPORT}

          public final class MarkdownPreviewToolMenu
                  extends BaseTextEditorToolMenu {

              private static final int MAX_CHARS =
                      300000;

              private final ExecutorService executor =
                      Executors.newSingleThreadExecutor();

              private final Handler mainHandler =
                      new Handler(
                              Looper.getMainLooper()
                      );

              private MarkwonRenderer renderer;

              @Override
              public String name() {
                  return "Markdown 预览";
              }

              @Override
              public Drawable icon() {
                  return ${MATERIAL_ICON_EXPR};
              }

              @Override
              public boolean checkVisible(
                      TextEditor editor
              ) {
                  return true;
              }

              @Override
              public void onMenuClick(
                      PluginUI pluginUI,
                      TextEditor editor
              ) {

                  final String markdown;

                  try {

                      markdown =
                              readMarkdown(
                                      editor
                              );

                  } catch (Throwable error) {

                      pluginUI.showErrorMessage(
                              error
                      );

                      return;
                  }

                  if (
                          markdown == null ||
                          markdown.trim().isEmpty()
                  ) {

                      pluginUI.showToast(
                              "没有可预览的 Markdown 内容"
                      );

                      return;
                  }

                  final String source;

                  if (
                          markdown.length() >
                                  MAX_CHARS
                  ) {

                      source =
                              markdown.substring(
                                      0,
                                      MAX_CHARS
                              );

                      pluginUI.showToast(
                              "文档超过 300000 字符，"
                                      + "只渲染前 300000 字符"
                      );

                  } else {

                      source = markdown;
                  }

                  try {

                      Context context =
                              pluginUI.getContext();

                      if (renderer == null) {

                          renderer =
                                  new MarkwonRenderer(
                                          context,
                                          pluginUI.sp2px(16)
                                  );
                      }

                      PluginView preview =
                              pluginUI
                                      .buildVerticalLayout()
                                      .paddingDp(4)
                                      .addTextView(
                                              "markdown_content"
                                      )
                                      .text("")
                                      .paddingDp(16)
                                      .widthMatchParent()
                                      .build();

                      PluginTextView pluginTextView =
                              preview.requireViewById(
                                      "markdown_content"
                              );

                      PluginDialog dialog =
                              pluginUI
                                      .buildDialog()
                                      .setTitle(
                                              "Markdown 预览 · Markwon 4.6.2"
                                      )
                                      .setView(
                                              preview
                                      )
                                      .setPositiveButton(
                                              "关闭",
                                              null
                                      )
                                      .create();

                      dialog.show();

                      TextView nativeTextView =
                              NativeTextViewFinder.find(
                                      pluginTextView
                              );

                      if (
                              nativeTextView == null
                      ) {

                          throw new IllegalStateException(
                                  "无法取得 MT 原生 TextView"
                          );
                      }

                      pluginUI.showToast(
                              "正在渲染 Markdown…"
                      );

                      final TextView target =
                              nativeTextView;

                      executor.execute(
                              () -> {

                                  try {

                                      final Spanned rendered =
                                              renderer.render(
                                                      source
                                              );

                                      mainHandler.post(
                                              () -> {

                                                  try {

                                                      /*
                                                       * 关键点：
                                                       *
                                                       * Markwon 不经过 HTML。
                                                       *
                                                       * 使用 setParsedMarkdown/
                                                       * setMarkdown 的完整生命周期，
                                                       * 让图片、LaTeX Drawable、
                                                       * 代码高亮等插件得到
                                                       * beforeSetText/afterSetText
                                                       * 回调。
                                                       */
                                                      renderer
                                                              .getClass();

                                                      renderer
                                                              .apply(
                                                                      target,
                                                                      rendered
                                                              );

                                                      pluginUI
                                                              .cancelToast();

                                                  } catch (
                                                          Throwable error
                                                  ) {

                                                      pluginUI
                                                              .showErrorMessage(
                                                                      error
                                                              );
                                                  }
                                              }
                                      );

                                  } catch (
                                          Throwable error
                                  ) {

                                      mainHandler.post(
                                              () ->
                                                      pluginUI
                                                              .showErrorMessage(
                                                                      error
                                                              )
                                      );
                                  }
                              }
                      );

                  } catch (Throwable error) {

                      pluginUI.showErrorMessage(
                              error
                      );
                  }
              }

              private String readMarkdown(
                      TextEditor editor
              ) {

                  int start =
                          editor.getSelectionStart();

                  int end =
                          editor.getSelectionEnd();

                  if (start != end) {

                      return editor.subText(
                              start,
                              end
                      );
                  }

                  return editor.subText(
                          0,
                          editor.length()
                  );
              }
          }
          JAVA

      - name: Add Markwon apply method
        shell: bash
        run: |
          set -e

          FILE="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkwonRenderer.java"

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkwonRenderer.java"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          old = """
              public void renderInto(
                      TextView textView,
                      String markdown
              ) {

                  markwon.setMarkdown(
                          textView,
                          normalizeLatex(markdown)
                  );
              }
          """.strip()

          new = """
              public void apply(
                      TextView textView,
                      Spanned rendered
              ) {

                  markwon.setParsedMarkdown(
                          textView,
                          rendered
                  );
              }
          """.strip()

          if old not in text:
              raise SystemExit(
                  "ERROR: renderInto block not found"
              )

          text = text.replace(
              old,
              new
          )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      - name: Remove unused Markwon renderer method import
        shell: bash
        run: |
          set -e

          FILE="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkwonRenderer.java"

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkwonRenderer.java"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          text = text.replace(
              "import android.widget.TextView;\n",
              "import android.widget.TextView;\n"
          )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      - name: Verify Java sources
        shell: bash
        run: |
          set -e

          echo "===== MarkwonRenderer.java ====="
          sed -n '1,520p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkwonRenderer.java

          echo
          echo "===== MarkdownPreviewToolMenu.java ====="
          sed -n '1,520p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkdownPreviewToolMenu.java

          echo
          echo "===== NativeTextViewFinder.java ====="
          sed -n '1,420p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/NativeTextViewFinder.java

          echo
          echo "===== Prism bundle ====="
          sed -n '1,260p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkdownPrismBundle.java

      - name: Configure Gradle dependencies
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "mt-plugin-v3-demo/template/build.gradle"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # Remove old renderer dependencies.
          # ---------------------------------------------------------

          prefixes = (
              'implementation "org.commonmark:',
              'implementation "io.noties.markwon:',
              'implementation "io.noties:',
              'annotationProcessor "io.noties:',
          )

          cleaned = []

          for line in text.splitlines():

              stripped = line.strip()

              if any(
                  stripped.startswith(
                      prefix
                  )
                  for prefix in prefixes
              ):
                  continue

              cleaned.append(line)

          text = "\n".join(
              cleaned
          ) + "\n"

          # ---------------------------------------------------------
          # Replace mtPlugin {...} safely.
          # ---------------------------------------------------------

          marker = "mtPlugin"
          start = text.find(marker)

          if start < 0:
              raise SystemExit(
                  "ERROR: mtPlugin block not found"
              )

          open_brace = text.find(
              "{",
              start
          )

          if open_brace < 0:
              raise SystemExit(
                  "ERROR: mtPlugin opening brace not found"
              )

          depth = 0
          end = None

          for i in range(
              open_brace,
              len(text)
          ):

              if text[i] == "{":
                  depth += 1

              elif text[i] == "}":

                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit(
                  "ERROR: mtPlugin closing brace not found"
              )

          plugin_block = """
          mtPlugin {
              pluginID = "com.example.mtmarkdownpreview"
              versionCode = 20
              versionName = "v3.0.0"
              name = "Markdown 预览"
              description = "MT 管理器高质量 Markdown 预览 · Markwon · LaTeX · GFM · 代码高亮 · 图片"

              interfaces = [
                  "com.example.mtmarkdown.MarkdownPreviewToolMenu"
              ]
          }
          """.strip()

          text = (
              text[:start]
              + plugin_block
              + text[end:]
          )

          # ---------------------------------------------------------
          # Add Markwon.
          # ---------------------------------------------------------

          dependencies = """
                  implementation "io.noties.markwon:core:4.6.2"
                  implementation "io.noties.markwon:ext-strikethrough:4.6.2"
                  implementation "io.noties.markwon:ext-tables:4.6.2"
                  implementation "io.noties.markwon:ext-tasklist:4.6.2"
                  implementation "io.noties.markwon:ext-latex:4.6.2"
                  implementation "io.noties.markwon:html:4.6.2"
                  implementation "io.noties.markwon:image:4.6.2"
                  implementation "io.noties.markwon:inline-parser:4.6.2"
                  implementation "io.noties.markwon:syntax-highlight:4.6.2"
                  implementation "io.noties:prism4j:2.0.0"

                  annotationProcessor "io.noties:prism4j-bundler:2.0.0"
          """.strip()

          dependency_marker =
              text.find(
                  "dependencies {"
              )

          if dependency_marker < 0:

              text += (
                  "\n"
                  "dependencies {\n"
                  + dependencies
                  + "\n}\n"
              )

          else:

              dependency_brace =
                  text.find(
                      "{",
                      dependency_marker
                  )

              if dependency_brace < 0:
                  raise SystemExit(
                      "ERROR: dependencies opening brace not found"
                  )

              text = (
                  text[
                      :dependency_brace + 1
                  ]
                  + "\n"
                  + dependencies
                  + text[
                      dependency_brace + 1:
                  ]
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "build.gradle updated"
          )
          PY

      - name: Final validation
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path(
              "mt-plugin-v3-demo/template/src/main/AndroidManifest.xml"
          )

          ET.parse(manifest)

          build_gradle = Path(
              "mt-plugin-v3-demo/template/build.gradle"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              'pluginID = "com.example.mtmarkdownpreview"',
              'versionName = "v3.0.0"',
              'com.example.mtmarkdown.MarkdownPreviewToolMenu',
              'io.noties.markwon:core:4.6.2',
              'io.noties.markwon:ext-latex:4.6.2',
              'io.noties.markwon:syntax-highlight:4.6.2',
              'io.noties:prism4j:2.0.0',
              'annotationProcessor "io.noties:prism4j-bundler:2.0.0"',
          ]

          for item in required:

              if item not in build_gradle:
                  raise SystemExit(
                      "ERROR: missing required Gradle entry: "
                      + item
                  )

          source_root = Path(
              "mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"
          )

          expected_files = [
              source_root / "MarkdownPrismBundle.java",
              source_root / "MarkwonRenderer.java",
              source_root / "NativeTextViewFinder.java",
              source_root / "MarkdownPreviewToolMenu.java",
          ]

          for file in expected_files:

              if not file.is_file():
                  raise SystemExit(
                      "ERROR: missing source file: "
                      + str(file)
                  )

          print("Final source/config validation: OK")
          PY

      - name: Prepare Gradle
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

      - name: Build release MTP
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -e

          ./gradlew \
            template:packageReleaseMtp \
            --stacktrace \
            --no-daemon

      - name: Verify MTP
        shell: bash
        run: |
          set -e

          OUTPUT_DIR="mt-plugin-v3-demo/template/build/outputs/mt-plugin"

          echo "===== GENERATED MTP ====="

          find \
            "${OUTPUT_DIR}" \
            -maxdepth 2 \
            -type f \
            -name "*.mtp" \
            -print \
            -exec ls -lh {} \;

          COUNT="$(
            find \
              "${OUTPUT_DIR}" \
              -maxdepth 2 \
              -type f \
              -name "*.mtp" |
            wc -l
          )"

          if [ "${COUNT}" -eq 0 ]; then
            echo "ERROR: MTP was not generated."
            exit 1
          fi

      - name: Upload final MTP
        uses: actions/upload-artifact@v4
        with:
          name: MT-Markdown-Preview-v3.0.0
          path: |
            mt-plugin-v3-demo/template/build/outputs/mt-plugin/*.mtp
          if-no-files-found: error
