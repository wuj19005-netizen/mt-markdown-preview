name: Build MT Markdown Preview V3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -eu
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          sdkmanager --version
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36|build-tools;35.0.0' || true

      - name: Fetch MT Plugin V3 demo
        shell: bash
        run: |
          set -eu
          rm -rf "${GITHUB_WORKSPACE}/mt-plugin-v3-demo"
          git clone --depth 1 https://gitee.com/L-JINBIN/mt-plugin-v3-demo.git "${GITHUB_WORKSPACE}/mt-plugin-v3-demo"
          test -f "${GITHUB_WORKSPACE}/mt-plugin-v3-demo/gradlew"
          test -f "${GITHUB_WORKSPACE}/mt-plugin-v3-demo/template/build.gradle"

      - name: Overlay plugin source
        shell: bash
        run: |
          set -eux
          DEMO_DIR="${GITHUB_WORKSPACE}/mt-plugin-v3-demo"
          SRC_DIR="${GITHUB_WORKSPACE}"

          test -d "${DEMO_DIR}"
          test -d "${SRC_DIR}/template"
          test -f "${SRC_DIR}/template/build.gradle"

          shopt -s dotglob nullglob
          for item in "${SRC_DIR}"/*; do
            base="$(basename "${item}")"
            case "${base}" in
              .git|mt-plugin-v3-demo)
                continue
                ;;
            esac
            rm -rf "${DEMO_DIR:?}/${base}"
            cp -a "${item}" "${DEMO_DIR}/${base}"
          done

          for item in "${SRC_DIR}"/.[!.]*; do
            [ -e "${item}" ] || continue
            base="$(basename "${item}")"
            case "${base}" in
              .git)
                continue
                ;;
            esac
            rm -rf "${DEMO_DIR:?}/${base}"
            cp -a "${item}" "${DEMO_DIR}/${base}"
          done

          test -f "${DEMO_DIR}/gradlew"
          test -f "${DEMO_DIR}/template/build.gradle"
          test -f "${DEMO_DIR}/template/src/main/java/com/example/mtmarkdown/MarkdownPreviewToolMenu.java"
          test -f "${DEMO_DIR}/template/src/main/java/com/example/mtmarkdown/MarkdownRenderer.java"
          test -f "${DEMO_DIR}/template/src/main/java/com/example/mtmarkdown/MarkdownPreprocessor.java"

      - name: Build release MTP
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -eux
          chmod +x ./gradlew
          ./gradlew template:packageReleaseMtp --stacktrace --no-daemon

      - name: Verify MTP output
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -eux
          OUT="template/build/outputs/mt-plugin"
          test -d "${OUT}"
          find "${OUT}" -maxdepth 1 -type f -name '*.mtp' -print
          test -n "$(find "${OUT}" -maxdepth 1 -type f -name '*.mtp' -print -quit)"

      - name: Upload installable MTP
        uses: actions/upload-artifact@v4
        with:
          name: mt-markdown-preview-v3-mtp
          path: mt-plugin-v3-demo/template/build/outputs/mt-plugin/*.mtp
          if-no-files-found: error
          retention-days: 14
