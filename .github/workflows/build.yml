name: Build MT Markdown Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7

      - name: Clone official MT V3 template
        shell: bash
        run: |
          set -e

          rm -rf mt-plugin-v3-demo

          git clone \
            --depth=1 \
            --branch=main \
            https://gitee.com/L-JINBIN/mt-plugin-v3-demo.git \
            mt-plugin-v3-demo

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK command line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            --licenses \
            >/tmp/android-sdk-licenses.log 2>&1 || true

          cat /tmp/android-sdk-licenses.log

      - name: Verify Java and Android environment
        shell: bash
        run: |
          set -e

          echo "===== JAVA ====="
          java -version

          echo
          echo "===== JAVA_HOME ====="
          echo "${JAVA_HOME}"

          echo
          echo "===== ANDROID_SDK_ROOT ====="
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "===== SDK MANAGER ====="
          command -v sdkmanager
          sdkmanager --version

          echo
          echo "===== ANDROID PLATFORM 36 ====="
          test -d "${ANDROID_SDK_ROOT}/platforms/android-36"
          ls -la "${ANDROID_SDK_ROOT}/platforms/android-36"

          echo
          echo "===== BUILD TOOLS 36.0.0 ====="
          test -d "${ANDROID_SDK_ROOT}/build-tools/36.0.0"
          ls -la "${ANDROID_SDK_ROOT}/build-tools/36.0.0"

      - name: Detect MT MaterialIcons import
        shell: bash
        run: |
          set -e

          MATERIAL_IMPORT="$(
            grep -Rho \
              '^import [^;]*MaterialIcons;' \
              mt-plugin-v3-demo \
              2>/dev/null \
              | head -n 1 || true
          )"

          if [ -z "${MATERIAL_IMPORT}" ]; then
            echo "ERROR: MaterialIcons import not found."
            grep -R \
              "MaterialIcons" \
              mt-plugin-v3-demo \
              2>/dev/null \
              | head -n 100 || true
            exit 1
          fi

          MATERIAL_ICON_EXPR="$(
            grep -Rho \
              'MaterialIcons\.get("[^"]*")' \
              mt-plugin-v3-demo \
              2>/dev/null \
              | head -n 1 || true
          )"

          if [ -z "${MATERIAL_ICON_EXPR}" ]; then
            MATERIAL_ICON_EXPR='MaterialIcons.get("preview")'
          fi

          echo "MATERIAL_IMPORT=${MATERIAL_IMPORT}" >> "${GITHUB_ENV}"
          echo "MATERIAL_ICON_EXPR=${MATERIAL_ICON_EXPR}" >> "${GITHUB_ENV}"

          echo "Detected MaterialIcons import:"
          echo "${MATERIAL_IMPORT}"

          echo "Detected icon expression:"
          echo "${MATERIAL_ICON_EXPR}"

      - name: Inject Markdown renderer
        shell: bash
        run: |
          set -e

          SRC="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"
          ENGINE="${SRC}/engine"

          mkdir -p "${ENGINE}"

          cat > "${SRC}/MarkdownHtml.java" <<'JAVA'
          package com.example.mtmarkdown;

          import android.os.Build;
          import android.text.Html;
          import android.text.Spanned;

          public final class MarkdownHtml {

              private MarkdownHtml() {
              }

              public static Spanned fromHtml(String html) {
                  if (html == null || html.isEmpty()) {
                      return Html.fromHtml("");
                  }

                  String safe = normalize(html);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      return Html.fromHtml(
                              safe,
                              Html.FROM_HTML_MODE_LEGACY
                      );
                  }

                  //noinspection deprecation
                  return Html.fromHtml(safe);
              }

              private static String normalize(String html) {
                  String result = html;

                  /*
                   * CommonMark task list output contains
                   * input checkbox tags. Android Html.fromHtml()
                   * does not display those as normal text, so convert
                   * them into visible markers.
                   */
                  result = result.replaceAll(
                          "(?is)<input[^>]*type=[\\\"']checkbox[\\\"'][^>]*checked[^>]*>",
                          "☑ "
                  );

                  result = result.replaceAll(
                          "(?is)<input[^>]*type=[\\\"']checkbox[\\\"'][^>]*>",
                          "☐ "
                  );

                  /*
                   * Images are converted to a readable placeholder.
                   */
                  result = result.replaceAll(
                          "(?is)<img[^>]*alt=[\\\"']([^\\\"']*)[\\\"'][^>]*>",
                          "<i>[图片: $1]</i>"
                  );

                  result = result.replaceAll(
                          "(?is)<img[^>]*>",
                          "<i>[图片]</i>"
                  );

                  /*
                   * Code blocks.
                   */
                  result = result.replace(
                          "<pre>",
                          "<br><tt><small>"
                  );

                  result = result.replace(
                          "</pre>",
                          "</small></tt><br>"
                  );

                  result = result.replace(
                          "<code>",
                          "<tt>"
                  );

                  result = result.replace(
                          "</code>",
                          "</tt>"
                  );

                  /*
                   * Android Html.fromHtml() has limited table support.
                   * Convert table cells to readable text.
                   */
                  result = result.replaceAll(
                          "(?i)<tr[^>]*>",
                          ""
                  );

                  result = result.replaceAll(
                          "(?i)</tr>",
                          "<br>"
                  );

                  result = result.replaceAll(
                          "(?i)</?(th|td)[^>]*>",
                          " | "
                  );

                  result = result.replaceAll(
                          "(?i)</?(thead|tbody|tfoot|table)[^>]*>",
                          ""
                  );

                  /*
                   * Alerts generated by GFM.
                   */
                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-note[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>提示</b><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-tip[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>提示</b><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-important[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>重要</b><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-warning[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>警告</b><br>"
                  );

                  result = result.replaceAll(
                          "(?is)<blockquote[^>]*class=[\\\"'][^\\\"']*markdown-alert-caution[^\\\"']*[\\\"'][^>]*>",
                          "<br><b>注意</b><br>"
                  );

                  return result;
              }
          }
          JAVA

          cat > "${ENGINE}/MarkdownRendererEngine.java" <<'JAVA'
          package com.example.mtmarkdown.engine;

          public interface MarkdownRendererEngine {

              String renderToHtml(String markdown);

              String versionName();
          }
          JAVA

          cat > "${ENGINE/CommonMarkRendererEngine.java}" <<'JAVA'
          package com.example.mtmarkdown.engine;

          import org.commonmark.Extension;
          import org.commonmark.ext.autolink.AutolinkExtension;
          import org.commonmark.ext.footnotes.FootnotesExtension;
          import org.commonmark.ext.gfm.alerts.AlertsExtension;
          import org.commonmark.ext.gfm.strikethrough.StrikethroughExtension;
          import org.commonmark.ext.gfm.tables.TablesExtension;
          import org.commonmark.ext.task.list.items.TaskListItemsExtension;
          import org.commonmark.node.Node;
          import org.commonmark.parser.Parser;
          import org.commonmark.renderer.html.HtmlRenderer;

          import java.util.Arrays;
          import java.util.List;

          public final class CommonMarkRendererEngine
                  implements MarkdownRendererEngine {

              private final Parser parser;
              private final HtmlRenderer renderer;

              public CommonMarkRendererEngine() {

                  List<Extension> extensions = Arrays.asList(
                          TablesExtension.create(),
                          StrikethroughExtension.create(),
                          TaskListItemsExtension.create(),
                          AutolinkExtension.create(),
                          FootnotesExtension.create(),
                          AlertsExtension.create()
                  );

                  parser = Parser.builder()
                          .extensions(extensions)
                          .build();

                  renderer = HtmlRenderer.builder()
                          .extensions(extensions)
                          .escapeHtml(true)
                          .sanitizeUrls(true)
                          .build();
              }

              @Override
              public String renderToHtml(String markdown) {

                  if (markdown == null ||
                          markdown.isEmpty()) {
                      return "<p></p>";
                  }

                  Node document =
                          parser.parse(markdown);

                  return renderer.render(document);
              }

              @Override
              public String versionName() {
                  return "CommonMark 0.30.0";
              }
          }
          JAVA

      - name: Inject Markdown preview menu
        shell: bash
        run: |
          set -e

          SRC="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"

          cat > "${SRC}/MarkdownPreviewToolMenu.java" <<JAVA
          package com.example.mtmarkdown;

          import android.graphics.drawable.Drawable;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.Spanned;

          import com.example.mtmarkdown.engine.CommonMarkRendererEngine;
          import com.example.mtmarkdown.engine.MarkdownRendererEngine;

          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          import bin.mt.plugin.api.editor.BaseTextEditorToolMenu;
          import bin.mt.plugin.api.editor.TextEditor;
          import bin.mt.plugin.api.ui.PluginUI;

          ${MATERIAL_IMPORT}

          public final class MarkdownPreviewToolMenu
                  extends BaseTextEditorToolMenu {

              private static final int MAX_PREVIEW_CHARS = 300000;

              private final ExecutorService executor =
                      Executors.newSingleThreadExecutor(
                              r -> {
                                  Thread thread =
                                          new Thread(
                                                  r,
                                                  "mt-markdown-renderer"
                                          );

                                  thread.setDaemon(true);

                                  return thread;
                              }
                      );

              private final Handler mainHandler =
                      new Handler(
                              Looper.getMainLooper()
                      );

              private final MarkdownRendererEngine
                      rendererEngine =
                      new CommonMarkRendererEngine();

              @Override
              public String name() {
                  return "Markdown 预览";
              }

              @Override
              public Drawable icon() {
                  return ${MATERIAL_ICON_EXPR};
              }

              @Override
              public boolean checkVisible(
                      TextEditor editor
              ) {
                  return true;
              }

              @Override
              public void onMenuClick(
                      PluginUI pluginUI,
                      TextEditor editor
              ) {

                  final String markdown =
                          readMarkdown(editor);

                  if (markdown == null ||
                          markdown.trim().isEmpty()) {

                      pluginUI.showToast(
                              "没有可预览的 Markdown 内容"
                      );

                      return;
                  }

                  if (markdown.length() >
                          MAX_PREVIEW_CHARS) {

                      pluginUI.buildDialog()
                              .setTitle("Markdown 预览")
                              .setMessage(
                                      "当前内容超过 300000 个字符，"
                                              + "本次仅渲染前 300000 个字符。"
                              )
                              .setPositiveButton(
                                      "继续",
                                      (dialog, which) ->
                                              renderAsync(
                                                      pluginUI,
                                                      markdown.substring(
                                                              0,
                                                              MAX_PREVIEW_CHARS
                                                      )
                                              )
                              )
                              .setNegativeButton(
                                      "取消",
                                      null
                              )
                              .show();

                      return;
                  }

                  renderAsync(
                          pluginUI,
                          markdown
                  );
              }

              private String readMarkdown(
                      TextEditor editor
              ) {

                  int start =
                          editor.getSelectionStart();

                  int end =
                          editor.getSelectionEnd();

                  /*
                   * 有选区：预览选中的 Markdown。
                   * 无选区：预览整个编辑器内容。
                   */
                  if (start != end) {

                      return editor.subText(
                              start,
                              end
                      );
                  }

                  return editor.subText(
                          0,
                          editor.length()
                  );
              }

              private void renderAsync(
                      PluginUI pluginUI,
                      String markdown
              ) {

                  pluginUI.showToast(
                          "正在渲染 Markdown…"
                  );

                  executor.execute(
                          () -> {

                              try {

                                  /*
                                   * 关键步骤：
                                   * Markdown -> HTML -> Spanned
                                   *
                                   * 最终直接交给 PluginUI.showMessage()
                                   * 的 CharSequence 参数，而不是先
                                   * .toString()，保证 Android
                                   * Spanned 样式不会被转换回原文。
                                   */
                                  String html =
                                          rendererEngine
                                                  .renderToHtml(
                                                          markdown
                                                  );

                                  Spanned content =
                                          MarkdownHtml
                                                  .fromHtml(
                                                          html
                                                  );

                                  mainHandler.post(
                                          () ->
                                                  showPreview(
                                                          pluginUI,
                                                          content
                                                  )
                                  );

                              } catch (Throwable error) {

                                  String message =
                                          error.getMessage();

                                  if (message == null ||
                                          message.isEmpty()) {

                                      message =
                                              error.getClass()
                                                      .getSimpleName();
                                  }

                                  final String
                                          finalMessage =
                                          message;

                                  mainHandler.post(
                                          () ->
                                                  pluginUI.showToast(
                                                          "Markdown 渲染失败: "
                                                                  + finalMessage
                                                  )
                                  );
                              }
                          }
                  );
              }

              private void showPreview(
                      PluginUI pluginUI,
                      Spanned content
              ) {

                  /*
                   * 不再使用：
                   *
                   * buildVerticalLayout()
                   *     .addTextView()
                   *     .text(content)
                   *
                   * 直接使用 PluginUI.showMessage()
                   * 的 CharSequence 参数，保留 Spanned。
                   */
                  pluginUI.showMessage(
                          "Markdown 预览 · "
                                  + rendererEngine
                                          .versionName(),
                          content
                  );
              }
          }
          JAVA

      - name: Configure MT plugin
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "mt-plugin-v3-demo/template/build.gradle"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # Replace mtPlugin block safely.
          # --------------------------------------------------------
          marker = "mtPlugin"
          start = text.find(marker)

          if start < 0:
              raise SystemExit(
                  "ERROR: mtPlugin block not found."
              )

          open_brace = text.find(
              "{",
              start
          )

          if open_brace < 0:
              raise SystemExit(
                  "ERROR: mtPlugin opening brace not found."
              )

          depth = 0
          end = None

          for i in range(
              open_brace,
              len(text)
          ):
              ch = text[i]

              if ch == "{":
                  depth += 1

              elif ch == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit(
                  "ERROR: mtPlugin closing brace not found."
              )

          new_block = """
          mtPlugin {
              pluginID = "com.example.mtmarkdownpreview"
              versionCode = 2
              versionName = "v1.1.0"
              name = "Markdown 预览"
              description = "MT 管理器 Markdown 预览与渲染引擎升级插件"

              interfaces = [
                  "com.example.mtmarkdown.MarkdownPreviewToolMenu"
              ]
          }
          """.strip()

          text = (
              text[:start]
              + new_block
              + text[end:]
          )

          # --------------------------------------------------------
          # Add CommonMark dependencies.
          # --------------------------------------------------------
          dependencies = """
                  implementation "org.commonmark:commonmark:0.30.0"
                  implementation "org.commonmark:commonmark-ext-gfm-tables:0.30.0"
                  implementation "org.commonmark:commonmark-ext-gfm-strikethrough:0.30.0"
                  implementation "org.commonmark:commonmark-ext-task-list-items:0.30.0"
                  implementation "org.commonmark:commonmark-ext-autolink:0.30.0"
                  implementation "org.commonmark:commonmark-ext-footnotes:0.30.0"
                  implementation "org.commonmark:commonmark-ext-gfm-alerts:0.30.0"
          """.strip()

          if (
              "org.commonmark:commonmark:0.30.0"
              not in text
          ):

              dependencies_start = text.find(
                  "dependencies {"
              )

              if dependencies_start < 0:

                  text += (
                      "\n\n"
                      "dependencies {\n"
                      + dependencies
                      + "\n}\n"
                  )

              else:

                  dependencies_brace = text.find(
                      "{",
                      dependencies_start
                  )

                  text = (
                      text[:dependencies_brace + 1]
                      + "\n"
                      + dependencies
                      + text[
                          dependencies_brace + 1:
                      ]
                  )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      - name: Verify plugin files
        shell: bash
        run: |
          set -e

          echo "===== BUILD GRADLE ====="

          sed -n '1,380p' \
            mt-plugin-v3-demo/template/build.gradle

          echo
          echo "===== MENU JAVA ====="

          sed -n '1,400p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkdownPreviewToolMenu.java

          echo
          echo "===== ENGINE JAVA ====="

          sed -n '1,320p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/engine/CommonMarkRendererEngine.java

          echo
          echo "===== HTML JAVA ====="

          sed -n '1,320p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkdownHtml.java

      - name: Prepare Gradle
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -e
          chmod +x ./gradlew

      - name: Check Gradle
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -e
          ./gradlew --version

      - name: Build release MTP
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -e

          ./gradlew \
            template:packageReleaseMtp \
            --stacktrace \
            --no-daemon

      - name: Find generated MTP
        shell: bash
        run: |
          set -e

          echo "===== GENERATED MTP ====="

          find \
            mt-plugin-v3-demo/template/build/outputs/mt-plugin \
            -maxdepth 2 \
            -type f \
            -name "*.mtp" \
            -print \
            -exec ls -lh {} \;

      - name: Upload MTP
        uses: actions/upload-artifact@v4
        with:
          name: MT-Markdown-Preview-v1.1.0
          path: |
            mt-plugin-v3-demo/template/build/outputs/mt-plugin/*.mtp
          if-no-files-found: error
