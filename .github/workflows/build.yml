name: Build MT Markdown Preview

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Clone official MT V3 template
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch=main \
            https://gitee.com/L-JINBIN/mt-plugin-v3-demo.git \
            mt-plugin-v3-demo

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/tmp/android-sdk-licenses.log 2>&1 || true

          cat /tmp/android-sdk-licenses.log

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android environment
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "===== Java ====="
          java -version

          echo
          echo "===== SDK Manager ====="
          sdkmanager --version

          echo
          echo "===== Android 36 ====="
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"

         
