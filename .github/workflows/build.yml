name: Build MT Markdown Preview V3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: mt-markdown-preview-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Verify standalone project
        shell: bash
        run: |
          set -euxo pipefail
          test -f "${GITHUB_WORKSPACE}/settings.gradle"
          test -f "${GITHUB_WORKSPACE}/build.gradle"
          test -f "${GITHUB_WORKSPACE}/gradle/libs.versions.toml"
          test -f "${GITHUB_WORKSPACE}/gradle.properties"
          test -f "${GITHUB_WORKSPACE}/template/build.gradle"
          test -f "${GITHUB_WORKSPACE}/template/src/main/java/com/example/mtmarkdown/MarkdownPreviewToolMenu.java"
          test -f "${GITHUB_WORKSPACE}/template/src/main/java/com/example/mtmarkdown/MarkdownRenderer.java"
          grep -q 'mt-plugin = "3.0.0"' "${GITHUB_WORKSPACE}/gradle/libs.versions.toml"
          grep -q 'agp = "8.13.2"' "${GITHUB_WORKSPACE}/gradle/libs.versions.toml"
          grep -q 'markwon = "4.6.2"' "${GITHUB_WORKSPACE}/gradle/libs.versions.toml"

      - name: Resolve Gradle project
        shell: bash
        run: |
          set -euxo pipefail
          gradle --version
          gradle --no-daemon --stacktrace projects

      - name: Build release MTP
        shell: bash
        run: |
          set -euxo pipefail
          gradle template:packageReleaseMtp --stacktrace --no-daemon

      - name: Verify MTP output
        shell: bash
        run: |
          set -euxo pipefail
          OUT="${GITHUB_WORKSPACE}/template/build/outputs/mt-plugin"
          test -d "${OUT}"
          find "${OUT}" -maxdepth 1 -type f -name '*.mtp' -print
          MTP="$(find "${OUT}" -maxdepth 1 -type f -name '*.mtp' -print -quit)"
          test -n "${MTP}"
          test -s "${MTP}"

      - name: Upload installable MTP
        uses: actions/upload-artifact@v4
        with:
          name: mt-markdown-preview-v3-mtp
          path: template/build/outputs/mt-plugin/*.mtp
          if-no-files-found: error
          retention-days: 14
