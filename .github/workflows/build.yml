name: Build MT Markdown Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone official MT V3 template
        shell: bash
        run: |
          set -e

          rm -rf mt-plugin-v3-demo

          git clone \
            --depth=1 \
            --branch=main \
            https://gitee.com/L-JINBIN/mt-plugin-v3-demo.git \
            mt-plugin-v3-demo

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android command line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            --licenses \
            >/tmp/android-sdk-licenses.log 2>&1 || true

          cat /tmp/android-sdk-licenses.log

      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "===== Java ====="
          java -version

          echo
          echo "===== Android SDK ====="
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "===== sdkmanager ====="
          command -v sdkmanager
          sdkmanager --version

          echo
          echo "===== Android 36 ====="
          test -d "${ANDROID_SDK_ROOT}/platforms/android-36"

          echo
          echo "===== Build Tools ====="
          test -d "${ANDROID_SDK_ROOT}/build-tools/36.0.0"

      - name: Detect MaterialIcons
        shell: bash
        run: |
          set -e

          MATERIAL_IMPORT="$(
            grep -Rho \
              '^import [^;]*MaterialIcons;' \
              mt-plugin-v3-demo \
              2>/dev/null \
              | head -n 1 || true
          )"

          if [ -z "${MATERIAL_IMPORT}" ]; then
            echo "ERROR: MaterialIcons import not found."
            grep -R \
              "MaterialIcons" \
              mt-plugin-v3-demo \
              2>/dev/null \
              | head -n 100 || true
            exit 1
          fi

          MATERIAL_ICON_EXPR="$(
            grep -Rho \
              'MaterialIcons\.get("[^"]*")' \
              mt-plugin-v3-demo \
              2>/dev/null \
              | head -n 1 || true
          )"

          if [ -z "${MATERIAL_ICON_EXPR}" ]; then
            MATERIAL_ICON_EXPR='MaterialIcons.get("visibility")'
          fi

          echo "MATERIAL_IMPORT=${MATERIAL_IMPORT}" >> "${GITHUB_ENV}"
          echo "MATERIAL_ICON_EXPR=${MATERIAL_ICON_EXPR}" >> "${GITHUB_ENV}"

      - name: Configure internet permission
        shell: bash
        run: |
          set -e

          MANIFEST="mt-plugin-v3-demo/template/src/main/AndroidManifest.xml"

          if [ ! -f "${MANIFEST}" ]; then
            echo "ERROR: AndroidManifest.xml not found:"
            echo "${MANIFEST}"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "mt-plugin-v3-demo/template/src/main/AndroidManifest.xml"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET" />'
          )

          if "android.permission.INTERNET" not in text:
              match = re.search(
                  r"<manifest\b[^>]*>",
                  text
              )

              if not match:
                  raise SystemExit(
                      "ERROR: manifest opening tag not found."
                  )

              insert_at = match.end()

              text = (
                  text[:insert_at]
                  + "\n    "
                  + permission
                  + text[insert_at:]
              )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      - name: Create Markwon source
        shell: bash
        run: |
          set -e

          SRC="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"

          rm -rf "${SRC}"

          mkdir -p "${SRC}"

          cat > "${SRC}/MarkdownPrismBundle.java" <<'JAVA'
          package com.example.mtmarkdown;

          import io.noties.prism4j.annotations.PrismBundle;

          @PrismBundle(
                  includes = {
                          "clike",
                          "java",
                          "kotlin",
                          "javascript",
                          "json",
                          "python",
                          "xml",
                          "css",
                          "c",
                          "cpp",
                          "csharp",
                          "go",
                          "groovy",
                          "dart",
                          "sql",
                          "swift",
                          "scala",
                          "yaml",
                          "markdown",
                          "latex"
                  },
                  grammarLocatorClassName = ".MarkdownGrammarLocator"
          )
          public final class MarkdownPrismBundle {

              private MarkdownPrismBundle() {
              }
          }
          JAVA

          cat > "${SRC}/MarkwonRenderer.java" <<'JAVA'
          package com.example.mtmarkdown;

          import android.content.Context;
          import android.text.Spanned;

          import io.noties.markwon.Markwon;
          import io.noties.markwon.ext.strikethrough.StrikethroughPlugin;
          import io.noties.markwon.ext.tables.TablePlugin;
          import io.noties.markwon.ext.tasklist.TaskListPlugin;
          import io.noties.markwon.html.HtmlPlugin;
          import io.noties.markwon.image.ImagesPlugin;
          import io.noties.markwon.inlineparser.MarkwonInlineParserPlugin;
          import io.noties.markwon.latex.JLatexMathPlugin;
          import io.noties.markwon.syntax.Prism4jSyntaxHighlight;
          import io.noties.markwon.syntax.Prism4jThemeDefault;
          import io.noties.markwon.syntax.SyntaxHighlightPlugin;
          import io.noties.prism4j.Prism4j;

          public final class MarkwonRenderer {

              private final Markwon markwon;

              public MarkwonRenderer(
                      Context context,
                      int textSizePx
              ) {

                  Prism4j prism4j =
                          new Prism4j(
                                  new MarkdownGrammarLocator()
                          );

                  markwon =
                          Markwon.builder(context)

                                  /*
                                   * Standard Markdown core.
                                   */

                                  /*
                                   * GFM tables.
                                   */
                                  .usePlugin(
                                          TablePlugin.create(
                                                  context
                                          )
                                  )

                                  /*
                                   * GFM task lists.
                                   */
                                  .usePlugin(
                                          TaskListPlugin.create(
                                                  context
                                          )
                                  )

                                  /*
                                   * GFM strikethrough.
                                   */
                                  .usePlugin(
                                          StrikethroughPlugin.create()
                                  )

                                  /*
                                   * Markdown HTML.
                                   */
                                  .usePlugin(
                                          HtmlPlugin.create()
                                  )

                                  /*
                                   * Images:
                                   * http / https / file / data URI.
                                   */
                                  .usePlugin(
                                          ImagesPlugin.create()
                                  )

                                  /*
                                   * LaTeX inline parser.
                                   */
                                  .usePlugin(
                                          MarkwonInlineParserPlugin.create()
                                  )

                                  /*
                                   * LaTeX formula rendering.
                                   *
                                   * Supports block formulas:
                                   *
                                   * $$
                                   * E = mc^2
                                   * $$
                                   *
                                   * And inline formulas using Markwon's
                                   * enabled inline syntax.
                                   */
                                  .usePlugin(
                                          JLatexMathPlugin.create(
                                                  textSizePx,
                                                  new JLatexMathPlugin.BuilderConfigure() {
                                                      @Override
                                                      public void configureBuilder(
                                                              JLatexMathPlugin.Builder builder
                                                      ) {
                                                          builder
                                                                  .inlinesEnabled(true)
                                                                  .blocksEnabled(true);
                                                      }
                                                  }
                                          )
                                  )

                                  /*
                                   * Prism4j code highlighting.
                                   */
                                  .usePlugin(
                                          SyntaxHighlightPlugin.create(
                                                  prism4j,
                                                  Prism4jThemeDefault.create(),
                                                  "clike"
                                          )
                                  )

                                  .build();
              }

              public Spanned render(
                      String markdown
              ) {

                  if (markdown == null ||
                          markdown.isEmpty()) {

                      return markwon.toMarkdown("");
                  }

                  return markwon.toMarkdown(
                          markdown
                  );
              }

              public Markwon getMarkwon() {
                  return markwon;
              }
          }
          JAVA

      - name: Create Markdown preview menu
        shell: bash
        run: |
          set -e

          SRC="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"

          cat > "${SRC}/MarkdownPreviewToolMenu.java" <<JAVA
          package com.example.mtmarkdown;

          import android.content.Context;
          import android.graphics.drawable.Drawable;
          import android.text.Spanned;

          import bin.mt.plugin.api.editor.BaseTextEditorToolMenu;
          import bin.mt.plugin.api.editor.TextEditor;
          import bin.mt.plugin.api.ui.PluginUI;
          import bin.mt.plugin.api.ui.PluginView;

          ${MATERIAL_IMPORT}

          public final class MarkdownPreviewToolMenu
                  extends BaseTextEditorToolMenu {

              private static final int MAX_CHARS = 300000;

              private MarkwonRenderer renderer;

              @Override
              public String name() {
                  return "Markdown 预览";
              }

              @Override
              public Drawable icon() {
                  return ${MATERIAL_ICON_EXPR};
              }

              @Override
              public boolean checkVisible(
                      TextEditor editor
              ) {
                  return true;
              }

              @Override
              public void init() {
                  /*
                   * PluginContext 在 MT V3 运行时提供插件资源/
                   * 宿主环境。为了兼容不同 V3 API 版本，这里
                   * 不在编译期依赖额外的 Context 获取方法。
                   */
              }

              @Override
              public void onMenuClick(
                      PluginUI pluginUI,
                      TextEditor editor
              ) {

                  try {

                      String markdown =
                              readMarkdown(editor);

                      if (markdown == null ||
                              markdown.trim().isEmpty()) {

                          pluginUI.showToast(
                                  "没有可预览的 Markdown 内容"
                          );

                          return;
                      }

                      if (markdown.length() >
                              MAX_CHARS) {

                          markdown =
                                  markdown.substring(
                                          0,
                                          MAX_CHARS
                                  );

                          pluginUI.showToast(
                                  "内容超过 300000 字符，"
                                          + "已截取前 300000 字符"
                          );
                      }

                      /*
                       * 使用 MT PluginUI 的宿主 Context。
                       *
                       * PluginContext 在 V3 实现中作为
                       * Android ContextWrapper 使用。
                       */
                      Context context =
                              (Context) pluginUI.getContext();

                      if (renderer == null) {

                          renderer =
                                  new MarkwonRenderer(
                                          context,
                                          pluginUI.sp2px(16)
                                  );
                      }

                      /*
                       * Markdown
                       *    ↓
                       * Markwon
                       *    ↓
                       * Android-native Spanned
                       *
                       * 不经过 HTML。
                       */
                      Spanned rendered =
                              renderer.render(
                                      markdown
                              );

                      showPreview(
                              pluginUI,
                              rendered
                      );

                  } catch (Throwable error) {

                      pluginUI.showErrorMessage(
                              error
                      );
                  }
              }

              private String readMarkdown(
                      TextEditor editor
              ) {

                  int start =
                          editor.getSelectionStart();

                  int end =
                          editor.getSelectionEnd();

                  if (start != end) {

                      return editor.subText(
                              start,
                              end
                      );
                  }

                  return editor.subText(
                          0,
                          editor.length()
                  );
              }

              private void showPreview(
                      PluginUI pluginUI,
                      Spanned content
              ) {

                  /*
                   * Markwon produces Spanned directly.
                   *
                   * The PluginTextView builder receives the
                   * CharSequence unchanged, so heading / bold /
                   * italic / strike / code / list / quote /
                   * tables / images / LaTeX spans remain intact.
                   */

                  PluginView preview =
                          pluginUI
                                  .buildVerticalLayout()
                                  .addTextView(
                                          "markdown_content"
                                  )
                                  .text(
                                          content
                                  )
                                  .paddingDp(16)
                                  .widthMatchParent()
                                  .build();

                  pluginUI
                          .buildDialog()
                          .setTitle(
                                  "Markdown 预览 · Markwon 4.6.2"
                          )
                          .setView(preview)
                          .setPositiveButton(
                                  "关闭",
                                  null
                          )
                          .show();
              }
          }
          JAVA

      - name: Configure Gradle dependencies
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "mt-plugin-v3-demo/template/build.gradle"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # Replace mtPlugin block safely.
          # ---------------------------------------------------------

          marker = "mtPlugin"
          start = text.find(marker)

          if start < 0:
              raise SystemExit(
                  "ERROR: mtPlugin block not found."
              )

          open_brace = text.find(
              "{",
              start
          )

          if open_brace < 0:
              raise SystemExit(
                  "ERROR: mtPlugin opening brace not found."
              )

          depth = 0
          end = None

          for i in range(
              open_brace,
              len(text)
          ):

              ch = text[i]

              if ch == "{":
                  depth += 1

              elif ch == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit(
                  "ERROR: mtPlugin closing brace not found."
              )

          plugin_block = """
          mtPlugin {
              pluginID = "com.example.mtmarkdownpreview"
              versionCode = 10
              versionName = "v2.0.0"
              name = "Markdown 预览"
              description = "MT 管理器 Markdown 预览插件 · Markwon · LaTeX · GFM · 代码高亮"

              interfaces = [
                  "com.example.mtmarkdown.MarkdownPreviewToolMenu"
              ]
          }
          """.strip()

          text = (
              text[:start]
              + plugin_block
              + text[end:]
          )

          # ---------------------------------------------------------
          # Remove our previous Markwon / CommonMark dependency lines
          # if the workflow is re-run against an existing checked-out
          # template.
          # ---------------------------------------------------------

          unwanted_prefixes = (
              "implementation \"org.commonmark:",
              "implementation \"io.noties.markwon:",
              "implementation \"io.noties:",
              "annotationProcessor \"io.noties:",
          )

          lines = text.splitlines()

          filtered = []

          for line in lines:

              stripped = line.strip()

              if any(
                  stripped.startswith(prefix)
                  for prefix in unwanted_prefixes
              ):
                  continue

              filtered.append(line)

          text = "\n".join(filtered) + "\n"

          # ---------------------------------------------------------
          # Find dependencies block.
          # ---------------------------------------------------------

          dependencies = """
                  implementation "io.noties.markwon:core:4.6.2"
                  implementation "io.noties.markwon:ext-latex:4.6.2"
                  implementation "io.noties.markwon:ext-tables:4.6.2"
                  implementation "io.noties.markwon:ext-tasklist:4.6.2"
                  implementation "io.noties.markwon:ext-strikethrough:4.6.2"
                  implementation "io.noties.markwon:html:4.6.2"
                  implementation "io.noties.markwon:image:4.6.2"
                  implementation "io.noties.markwon:inline-parser:4.6.2"
                  implementation "io.noties.markwon:syntax-highlight:4.6.2"
                  implementation "io.noties:prism4j:2.0.0"

                  annotationProcessor "io.noties:prism4j-bundler:2.0.0"
          """.strip()

          dependency_marker = text.find(
              "dependencies {"
          )

          if dependency_marker < 0:

              text += (
                  "\n"
                  "dependencies {\n"
                  + dependencies
                  + "\n"
                  "}\n"
              )

          else:

              dependency_brace = text.find(
                  "{",
                  dependency_marker
              )

              if dependency_brace < 0:
                  raise SystemExit(
                      "ERROR: dependencies opening brace not found."
                  )

              text = (
                  text[:dependency_brace + 1]
                  + "\n"
                  + dependencies
                  + text[dependency_brace + 1:]
              )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      - name: Verify generated source
        shell: bash
        run: |
          set -e

          echo "===== AndroidManifest.xml ====="

          cat \
            mt-plugin-v3-demo/template/src/main/AndroidManifest.xml

          echo
          echo "===== template/build.gradle ====="

          sed -n '1,460p' \
            mt-plugin-v3-demo/template/build.gradle

          echo
          echo "===== MarkdownPrismBundle.java ====="

          sed -n '1,260p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkdownPrismBundle.java

          echo
          echo "===== MarkwonRenderer.java ====="

          sed -n '1,420p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkwonRenderer.java

          echo
          echo "===== MarkdownPreviewToolMenu.java ====="

          sed -n '1,480p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkdownPreviewToolMenu.java

      - name: Prepare Gradle
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

      - name: Check Gradle
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -e

          ./gradlew --version

      - name: Build release MTP
        working-directory: mt-plugin-v3-demo
        shell: bash
        run: |
          set -e

          ./gradlew \
            template:packageReleaseMtp \
            --stacktrace \
            --no-daemon

      - name: Verify MTP
        shell: bash
        run: |
          set -e

          OUTPUT_DIR="mt-plugin-v3-demo/template/build/outputs/mt-plugin"

          echo "===== MTP OUTPUT ====="

          find \
            "${OUTPUT_DIR}" \
            -maxdepth 2 \
            -type f \
            -name "*.mtp" \
            -print \
            -exec ls -lh {} \;

          COUNT="$(
            find \
              "${OUTPUT_DIR}" \
              -maxdepth 2 \
              -type f \
              -name "*.mtp" \
              | wc -l
          )"

          if [ "${COUNT}" -eq 0 ]; then
            echo "ERROR: No .mtp file was produced."
            exit 1
          fi

      - name: Upload final MTP
        uses: actions/upload-artifact@v4
        with:
          name: MT-Markdown-Preview-v2.0.0
          path: |
            mt-plugin-v3-demo/template/build/outputs/mt-plugin/*.mtp
          if-no-files-found: error
