name: Build MT Markdown Preview

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 3. Android SDK
      #
      # 不再手动调用旧的 cmdline-tools/latest/sdkmanager。
      # 使用 setup-android v4 自动安装并接受许可证。
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      # ============================================================
      # 4. 再次静默接受许可证
      #
      # 这是保险措施，避免新安装的 SDK 包仍然存在未接受许可证。
      # sdkmanager 已经由 setup-android 加入 PATH。
      # ============================================================
      - name: Accept all Android SDK licenses
        shell: bash
        run: |
          set +e

          yes | sdkmanager --licenses >/tmp/android-sdk-licenses.log 2>&1

          LICENSE_RESULT=$?

          cat /tmp/android-sdk-licenses.log

          if [ "$LICENSE_RESULT" -ne 0 ]; then
            echo "sdkmanager --licenses returned $LICENSE_RESULT"
            echo "继续执行，由下一步实际安装/构建结果判断。"
          fi

          set -e

      # ============================================================
      # 5. 检查 SDK
      # ============================================================
      - name: Check Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "===== sdkmanager ====="
          which sdkmanager
          sdkmanager --version

          echo
          echo "===== installed packages ====="
          sdkmanager --list_installed || true

          echo
          echo "===== Android 36 ====="
          ls -la "$ANDROID_SDK_ROOT/platforms/android-36" || true

          echo
          echo "===== Build Tools 36 ====="
          ls -la "$ANDROID_SDK_ROOT/build-tools/36.0.0" || true

      # ============================================================
      # 6. 下载官方 MT V3 Demo
      # ============================================================
      - name: Clone official MT V3 template
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch=main \
            https://gitee.com/L-JINBIN/mt-plugin-v3-demo.git \
            mt-plugin-v3-demo

      # ============================================================
      # 7. 检查官方模板
      # ============================================================
      - name: Inspect official MT template
        shell: bash
        run: |
          set -e

          echo "===== repository ====="
          ls -la mt-plugin-v3-demo

          echo
          echo "===== template ====="
          ls -la mt-plugin-v3-demo/template

          echo
          echo "===== template/build.gradle ====="
          sed -n '1,280p' \
            mt-plugin-v3-demo/template/build.gradle

      # ============================================================
      # 8. 自动寻找 MaterialIcons 实际包名
      #
      # 避免手写错误 import。
      # ============================================================
      - name: Detect MT MaterialIcons import
        shell: bash
        run: |
          set -e

          MATERIAL_IMPORT="$(
            grep -Rho \
              '^import [^;]*MaterialIcons;' \
              mt-plugin-v3-demo \
              2>/dev/null \
              | head -n 1 || true
          )"

          if [ -z "$MATERIAL_IMPORT" ]; then
            echo "ERROR: Cannot find MaterialIcons import."
            echo
            echo "Searching MaterialIcons references:"
            grep -R \
              "MaterialIcons" \
              mt-plugin-v3-demo \
              2>/dev/null \
              | head -n 50 || true
            exit 1
          fi

          echo "Detected MaterialIcons import:"
          echo "$MATERIAL_IMPORT"

          echo "MATERIAL_IMPORT=$MATERIAL_IMPORT" >> "$GITHUB_ENV"

      # ============================================================
      # 9. 创建 Markdown 插件源码
      # ============================================================
      - name: Inject Markdown Preview plugin
        shell: bash
        run: |
          set -e

          SRC="mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown"
          ENGINE="$SRC/engine"

          mkdir -p "$ENGINE"

          # --------------------------------------------------------
          # MarkdownHtml.java
          # --------------------------------------------------------
          cat > "$SRC/MarkdownHtml.java" <<'JAVA'
          package com.example.mtmarkdown;

          import android.os.Build;
          import android.text.Html;
          import android.text.Spanned;

          public final class MarkdownHtml {

              private MarkdownHtml() {
              }

              public static Spanned fromHtml(String html) {
                  if (html == null || html.isEmpty()) {
                      return Html.fromHtml("");
                  }

                  String safe = normalize(html);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      return Html.fromHtml(
                              safe,
                              Html.FROM_HTML_MODE_LEGACY
                      );
                  }

                  //noinspection deprecation
                  return Html.fromHtml(safe);
              }

              private static String normalize(String html) {
                  String result = html;

                  // Markdown checkbox.
                  result = result.replaceAll(
                          "(?is)<input[^>]*type=[\\\"']checkbox[\\\"'][^>]*checked[^>]*>",
                          "[x] "
                  );

                  result = result.replaceAll(
                          "(?is)<input[^>]*type=[\\\"']checkbox[\\\"'][^>]*>",
                          "[ ] "
                  );

                  // Images.
                  result = result.replaceAll(
                          "(?is)<img[^>]*alt=[\\\"']([^\\\"']*)[\\\"'][^>]*>",
                          "<i>[图片: $1]</i>"
                  );

                  result = result.replaceAll(
                          "(?is)<img[^>]*>",
                          "<i>[图片]</i>"
                  );

                  // Code blocks.
                  result = result.replace(
                          "<pre>",
                          "<br><tt><small>"
                  );

                  result = result.replace(
                          "</pre>",
                          "</small></tt><br>"
                  );

                  result = result.replace(
                          "<code>",
                          "<tt>"
                  );

                  result = result.replace(
                          "</code>",
                          "</tt>"
                  );

                  // Android Html 对 table 支持有限。
                  // 转成可读文本。
                  result = result.replaceAll(
                          "(?i)<tr[^>]*>",
                          ""
                  );

                  result = result.replaceAll(
                          "(?i)</tr>",
                          "<br>"
                  );

                  result = result.replaceAll(
                          "(?i)</?(th|td)[^>]*>",
                          " | "
                  );

                  result = result.replaceAll(
                          "(?i)</?(thead|tbody|tfoot|table)[^>]*>",
                          ""
                  );

                  return result;
              }
          }
          JAVA

          # --------------------------------------------------------
          # MarkdownRendererEngine.java
          # --------------------------------------------------------
          cat > "$ENGINE/MarkdownRendererEngine.java" <<'JAVA'
          package com.example.mtmarkdown.engine;

          public interface MarkdownRendererEngine {

              String renderToHtml(String markdown);

              String versionName();
          }
          JAVA

          # --------------------------------------------------------
          # CommonMarkRendererEngine.java
          # --------------------------------------------------------
          cat > "$ENGINE/CommonMarkRendererEngine.java" <<'JAVA'
          package com.example.mtmarkdown.engine;

          import org.commonmark.Extension;
          import org.commonmark.ext.autolink.AutolinkExtension;
          import org.commonmark.ext.footnotes.FootnotesExtension;
          import org.commonmark.ext.gfm.alerts.AlertsExtension;
          import org.commonmark.ext.gfm.strikethrough.StrikethroughExtension;
          import org.commonmark.ext.gfm.tables.TablesExtension;
          import org.commonmark.ext.task.list.items.TaskListItemsExtension;
          import org.commonmark.node.Node;
          import org.commonmark.parser.Parser;
          import org.commonmark.renderer.html.HtmlRenderer;

          import java.util.Arrays;
          import java.util.List;

          public final class CommonMarkRendererEngine
                  implements MarkdownRendererEngine {

              private final Parser parser;
              private final HtmlRenderer renderer;

              public CommonMarkRendererEngine() {

                  List<Extension> extensions = Arrays.asList(
                          TablesExtension.create(),
                          StrikethroughExtension.create(),
                          TaskListItemsExtension.create(),
                          AutolinkExtension.create(),
                          FootnotesExtension.create(),
                          AlertsExtension.create()
                  );

                  parser = Parser.builder()
                          .extensions(extensions)
                          .build();

                  renderer = HtmlRenderer.builder()
                          .extensions(extensions)
                          .escapeHtml(true)
                          .sanitizeUrls(true)
                          .build();
              }

              @Override
              public String renderToHtml(String markdown) {

                  if (markdown == null ||
                          markdown.isEmpty()) {
                      return "<p></p>";
                  }

                  Node document = parser.parse(markdown);

                  return renderer.render(document);
              }

              @Override
              public String versionName() {
                  return "CommonMark 0.30.0";
              }
          }
          JAVA

          # --------------------------------------------------------
          # MarkdownPreviewToolMenu.java
          # --------------------------------------------------------
          cat > "$SRC/MarkdownPreviewToolMenu.java" <<JAVA
          package com.example.mtmarkdown;

          import android.graphics.drawable.Drawable;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.Spanned;

          import com.example.mtmarkdown.engine.CommonMarkRendererEngine;
          import com.example.mtmarkdown.engine.MarkdownRendererEngine;

          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          import bin.mt.plugin.api.editor.BaseTextEditorToolMenu;
          import bin.mt.plugin.api.editor.TextEditor;
          import bin.mt.plugin.api.ui.PluginUI;
          import bin.mt.plugin.api.ui.PluginView;

          $MATERIAL_IMPORT

          public final class MarkdownPreviewToolMenu
                  extends BaseTextEditorToolMenu {

              private static final int MAX_PREVIEW_CHARS = 300000;

              private final ExecutorService executor =
                      Executors.newSingleThreadExecutor(r -> {

                          Thread thread = new Thread(
                                  r,
                                  "mt-markdown-renderer"
                          );

                          thread.setDaemon(true);

                          return thread;
                      });

              private final Handler mainHandler =
                      new Handler(
                              Looper.getMainLooper()
                      );

              private final MarkdownRendererEngine rendererEngine =
                      new CommonMarkRendererEngine();

              @Override
              public String name() {
                  return "Markdown 预览";
              }

              @Override
              public Drawable icon() {
                  return MaterialIcons.get("description");
              }

              @Override
              public boolean checkVisible(TextEditor editor) {
                  return true;
              }

              @Override
              public void onMenuClick(
                      PluginUI pluginUI,
                      TextEditor editor
              ) {

                  final String markdown =
                          readMarkdown(editor);

                  if (markdown == null ||
                          markdown.trim().isEmpty()) {

                      pluginUI.showToast(
                              "没有可预览的 Markdown 内容"
                      );

                      return;
                  }

                  if (markdown.length() >
                          MAX_PREVIEW_CHARS) {

                      pluginUI.buildDialog()
                              .setTitle("Markdown 预览")
                              .setMessage(
                                      "当前内容超过 300000 个字符，"
                                              + "本次仅渲染前 300000 个字符。"
                              )
                              .setPositiveButton(
                                      "继续",
                                      (dialog, which) ->
                                              renderAsync(
                                                      pluginUI,
                                                      markdown.substring(
                                                              0,
                                                              MAX_PREVIEW_CHARS
                                                      )
                                              )
                              )
                              .setNegativeButton(
                                      "取消",
                                      null
                              )
                              .show();

                      return;
                  }

                  renderAsync(
                          pluginUI,
                          markdown
                  );
              }

              private String readMarkdown(
                      TextEditor editor
              ) {

                  int start =
                          editor.getSelectionStart();

                  int end =
                          editor.getSelectionEnd();

                  if (start != end) {
                      return editor.subText(
                              start,
                              end
                      );
                  }

                  return editor.subText(
                          0,
                          editor.length()
                  );
              }

              private void renderAsync(
                      PluginUI pluginUI,
                      String markdown
              ) {

                  pluginUI.showToast(
                          "正在渲染 Markdown…"
                  );

                  executor.execute(() -> {

                      try {

                          String html =
                                  rendererEngine.renderToHtml(
                                          markdown
                                  );

                          Spanned spanned =
                                  MarkdownHtml.fromHtml(
                                          html
                                  );

                          mainHandler.post(
                                  () -> showPreview(
                                          pluginUI,
                                          spanned
                                  )
                          );

                      } catch (Throwable error) {

                          mainHandler.post(
                                  () -> pluginUI.showToast(
                                          "Markdown 渲染失败: "
                                                  + error.getMessage()
                                  )
                          );
                      }
                  });
              }

              private void showPreview(
                      PluginUI pluginUI,
                      Spanned content
              ) {

                  PluginView view =
                          pluginUI
                                  .buildVerticalLayout()
                                  .addTextView("content")
                                  .text(content)
                                  .paddingDp(12)
                                  .widthMatchParent()
                                  .build();

                  pluginUI
                          .buildDialog()
                          .setTitle(
                                  "Markdown 预览 · "
                                          + rendererEngine
                                                  .versionName()
                          )
                          .setView(view)
                          .setPositiveButton(
                                  "关闭",
                                  null
                          )
                          .show();
              }
          }
          JAVA

          echo
          echo "===== Generated source files ====="

          find \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown \
            -type f \
            -print

      # ============================================================
      # 10. 配置 MT plugin
      # ============================================================
      - name: Configure MT plugin
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "mt-plugin-v3-demo/template/build.gradle"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # 替换 mtPlugin { ... }
          # --------------------------------------------------------
          new_mt_plugin = """
          mtPlugin {
              pluginID = "com.example.mtmarkdownpreview"
              versionCode = 1
              versionName = "v1.0.0"
              name = "Markdown 预览"
              description = "MT 管理器 Markdown 预览与渲染引擎升级插件"

              interfaces = [
                  "com.example.mtmarkdown.MarkdownPreviewToolMenu"
              ]
          }
          """.strip()

          pattern = re.compile(
              r"(?ms)^mtPlugin\\s*\\{.*?^\\}"
          )

          text, count = pattern.subn(
              new_mt_plugin,
              text,
              count=1
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: mtPlugin { } block not found."
              )

          # --------------------------------------------------------
          # 添加 CommonMark 依赖
          # --------------------------------------------------------
          dependencies = """
                  implementation "org.commonmark:commonmark:0.30.0"
                  implementation "org.commonmark:commonmark-ext-gfm-tables:0.30.0"
                  implementation "org.commonmark:commonmark-ext-gfm-strikethrough:0.30.0"
                  implementation "org.commonmark:commonmark-ext-task-list-items:0.30.0"
                  implementation "org.commonmark:commonmark-ext-autolink:0.30.0"
                  implementation "org.commonmark:commonmark-ext-footnotes:0.30.0"
                  implementation "org.commonmark:commonmark-ext-gfm-alerts:0.30.0"
          """.strip()

          if (
              "org.commonmark:commonmark:0.30.0"
              not in text
          ):

              match = re.search(
                  r"(?m)^\\s*dependencies\\s*\\{",
                  text
              )

              if match:

                  start = match.start()
                  end = match.end()

                  text = (
                      text[:end]
                      + "\\n"
                      + dependencies
                      + text[end:]
                  )

              else:

                  text += (
                      "\\n\\n"
                      "dependencies {\\n"
                      + dependencies
                      + "\\n}\\n"
                  )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Updated:",
              path
          )
          PY

      # ============================================================
      # 11. 检查最终配置
      # ============================================================
      - name: Verify plugin configuration
        shell: bash
        run: |
          set -e

          echo "================================================"
          echo "template/build.gradle"
          echo "================================================"

          sed -n '1,320p' \
            mt-plugin-v3-demo/template/build.gradle

          echo
          echo "================================================"
          echo "MarkdownPreviewToolMenu.java"
          echo "================================================"

          sed -n '1,320p' \
            mt-plugin-v3-demo/template/src/main/java/com/example/mtmarkdown/MarkdownPreviewToolMenu.java

      # ============================================================
      # 12. Gradle 权限
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        working-directory: mt-plugin-v3-demo
        run: |
          chmod +x ./gradlew

      # ============================================================
      # 13. 查看 Gradle 版本
      # ============================================================
      - name: Check Gradle
        shell: bash
        working-directory: mt-plugin-v3-demo
        run: |
          ./gradlew --version

      # ============================================================
      # 14. 正式编译 MTP
      # ============================================================
      - name: Build release MTP
        shell: bash
        working-directory: mt-plugin-v3-demo
        run: |
          set -e

          ./gradlew \
            template:packageReleaseMtp \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 15. 查找生成的 MTP
      # ============================================================
      - name: Find generated MTP
        shell: bash
        run: |
          set -e

          echo "===== MTP output directory ====="

          find \
            mt-plugin-v3-demo/template/build/outputs/mt-plugin \
            -maxdepth 2 \
            -type f \
            -print \
            -exec ls -lh {} \;

      # ============================================================
      # 16. 上传最终 .mtp
      # ============================================================
      - name: Upload MTP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT-Markdown-Preview-v1.0.0
          path: |
            mt-plugin-v3-demo/template/build/outputs/mt-plugin/*.mtp
          if-no-files-found: error
